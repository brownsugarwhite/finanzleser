[build]
  command = "npm run build"
  publish = ".next"

# Wärmt nach jedem Deploy die Hub-Seiten vor (Landing, Haupt-/Subkategorien, Tool-
# Übersichten — Standard; WARM_FULL=true würde die ganze Sitemap wärmen), damit die
# meistbesuchten Einstiege beim ersten echten Besuch schnell sind.
# Abschalten via Env WARM_CACHE=false. Concurrency via WARM_CONCURRENCY.
[[plugins]]
  package = "/netlify/plugins/warm-cache"

# 410 Gone auf CDN-Ebene, damit diese URLs KEINE Function kosten.
#
# Hintergrund: `app/api/gone` und `app/page/[n]` deklarieren zwar `force-static`, werden
# aber trotzdem nicht prerendert — Next prerendert Route-Handler nur bei Status 200.
# Ergebnis: jeder Crawler-Hit auf eine dieser 27 URLs war eine Function-Invocation, und
# genau diese URLs crawlt Google besonders hartnäckig weiter.
#
# Die Next-Routen + rewrites() in next.config.ts BLEIBEN als Fallback bestehen: greift
# die CDN-Regel wider Erwarten nicht, ist das Verhalten unverändert wie bisher. Es kann
# also in keinem Fall eine SEO-Regression entstehen (410 deindexiert schneller als 404).
#
# Abnahme auf dem Deploy-Preview:
#   curl -sI https://<preview>/aenderungen-2019 | head -1     → HTTP/2 410
#   curl -sI https://<preview>/page/7          | head -1      → HTTP/2 410
[[redirects]]
  from = "/aenderungen-2019"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/ampel-kabinett-nach-73-tagen-im-amt"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/neue-regelungen-ab-juli-2025"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/neue-gesetzes-und-pflichtaenderungen-ab-2026"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/hochwasserschutz-kann-fuer-europa-kostspielig-werden"
  to = "/410.html"
  status = 410
  force = true

# R+V und OVAG stehen hier BEWUSST NICHT (mehr): fb7569d hat sie auf Wunsch aus der
# Nachjustierungs-Liste von 410 auf 301 -> /anbieter umgestellt (lib/redirects.manual.ts).
# Eine 410-Regel mit force = true wuerde diesen Redirect ueberstimmen — sie kam beim
# Merge des cleanup-Branches mit und ist am 30.08.2026 wieder entfernt worden.

# Alte Blog-Paginierung der Vorgaenger-Seite (/page/1 … /page/19)
[[redirects]]
  from = "/page/*"
  to = "/410.html"
  status = 410
  force = true

# ── Scanner-Proben am CDN abfangen ─────────────────────────────────────────────
#
# lib/botPaths.ts spart bereits die WP-Abfragen, aber die Function laeuft trotzdem an:
# Next-Server laden, 404 rendern. Und weil Non-200 NIE im Durable Cache landet, kostet
# jeder einzelne Scanner-Hit erneut eine Invocation — auch der tausendste auf dieselbe
# URL. Diese Grundlast ist von den Besucherzahlen voellig entkoppelt.
#
# Hier endet der Traffic am CDN, ohne Function. Bewusst nur die eindeutigen Praefixe:
# Netlify kann keine Regex, und die Muster aus botPaths.ts (Dateiendungen, Traversal-
# Encodings) lassen sich nicht vollstaendig abbilden. lib/botPaths.ts BLEIBT deshalb
# als Fallback in den drei Routen — greift eine Regel hier nicht, ist das Verhalten
# unveraendert wie bisher. Es kann also keine Regression entstehen.
#
# 🚨 Vor jeder Aenderung an dieser Liste: npm run verify:redirects -- --offline
#    Freigabebedingung ist NULL Treffer auf echten URLs. Eine zu breite Regel macht aus
#    einem funktionierenden 301 eine 404 und beschaedigt die GSC-Reparatur.
#
# 🚨 KEIN pauschales /wp-* — next.config.ts erlaubt in images.remotePatterns ausdruecklich
# Bilder von www.finanzleser.de/wp-content/uploads/** (also dieser Domain). Eine breite
# Regel haette die abgeschossen. Deshalb hier nur Pfade, unter denen es garantiert kein
# ausgeliefertes Asset gibt; /wp-content/uploads/ bleibt bewusst unberuehrt.
[[redirects]]
  from = "/wp-admin/*"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-json/*"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-content/plugins/*"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-content/themes/*"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-config.php"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-cron.php"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/vendor/*"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/cgi-bin/*"
  to = "/404-bot.html"
  status = 404
  force = true

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404-bot.html"
  status = 404
  force = true

[build.environment]
  # 22 (LTS): Netlify verlangt für Build-Plugins Node >= 22 — sonst wird das
  # warm-cache-Plugin übersprungen (Post-Deploy-Warming läuft dann nicht).
  NODE_VERSION = "22"
  # LEO-Backend des Kunden (RAG-Service auf Heroku). /api/chat proxyt darauf.
  # Gilt für alle Kontexte (Staging, Previews, Production) — ein einziges Backend.
  # Falls der Kunde später eine separate Prod-URL liefert: in [context.production.environment] überschreiben.
  LEO_BACKEND_URL = "https://leo-finanzleser-ea7e1549925c.herokuapp.com"

# Production-Site (deployt vom main-Branch, später)
# 🚨 WORDPRESS_API_URL steht hier BEWUSST NIRGENDS — in keinem Kontext.
#
# Variablen aus dieser Datei erreichen nur den BUILD, nicht die Functions zur
# Laufzeit (Netlify-Doku: netlify.toml-Variablen sind "available to builds" und
# "snippet injection"; Functions fehlen dort). Wer den Wert hier setzt, erzeugt
# einen Zustand, in dem Build und Laufzeit aus VERSCHIEDENEN Datenbanken lesen.
#
# Genau das ist am 03.09.2026 passiert: Der Deploy-Preview baute korrekt gegen das
# neue CMS (836 Seiten), aber jede Seite, die zur Laufzeit nachfragte, landete beim
# alten CMS — das die neuen Felder nicht kennt. Ergebnis: HTTP 500 auf allen
# Weiterleitungen aus der Kaskade und auf /suche. Der Fehler war umso tückischer,
# als der Build gruen war.
#
# Der Wert gehoert deshalb AUSSCHLIESSLICH ins Netlify-UI, dort pro Deploy-Kontext:
#   Project configuration → Environment variables → WORDPRESS_API_URL
#     Production      → das CMS, von dem die Live-Seite liest
#     Deploy previews → das CMS, gegen das getestet wird
#     Branch deploys  → dito
# Nur so ziehen Build und Laufzeit am selben Strang.

[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://www.finanzleser.de"

# Staging-Site (deployt vom staging-Branch)
[context.staging.environment]
  NEXT_PUBLIC_SITE_URL = "https://staging.finanzleser.de"
  # Echte AdSense-Ads (Testmodus data-adtest kommt automatisch über die
  # Staging-URL). Production bekommt das Flag erst mit der Live-Freigabe.
  NEXT_PUBLIC_ADSENSE = "1"

# Deploy-Previews und Branch-Deploys
[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_URL = "https://staging.finanzleser.de"
  NEXT_PUBLIC_ADSENSE = "1"

# Hinweis: noindex-Header für Staging wird in next.config.ts gesetzt
# (env-basiert über NEXT_PUBLIC_SITE_URL — funktioniert verlässlich
# bei Next.js SSR, anders als ein netlify.toml [[headers]] Block).
