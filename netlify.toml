[build]
  command = "npm run build"
  publish = ".next"

# Wärmt nach jedem Deploy die Hub-Seiten vor (Landing, Haupt-/Subkategorien, Tool-
# Übersichten — Standard; WARM_FULL=true würde die ganze Sitemap wärmen), damit die
# meistbesuchten Einstiege beim ersten echten Besuch schnell sind.
# Abschalten via Env WARM_CACHE=false. Concurrency via WARM_CONCURRENCY.
[[plugins]]
  package = "/netlify/plugins/warm-cache"

# 410 Gone auf CDN-Ebene, damit diese URLs KEINE Function kosten.
#
# Hintergrund: `app/api/gone` und `app/page/[n]` deklarieren zwar `force-static`, werden
# aber trotzdem nicht prerendert — Next prerendert Route-Handler nur bei Status 200.
# Ergebnis: jeder Crawler-Hit auf eine dieser 27 URLs war eine Function-Invocation, und
# genau diese URLs crawlt Google besonders hartnäckig weiter.
#
# Die Next-Routen + rewrites() in next.config.ts BLEIBEN als Fallback bestehen: greift
# die CDN-Regel wider Erwarten nicht, ist das Verhalten unverändert wie bisher. Es kann
# also in keinem Fall eine SEO-Regression entstehen (410 deindexiert schneller als 404).
#
# Abnahme auf dem Deploy-Preview:
#   curl -sI https://<preview>/aenderungen-2019 | head -1     → HTTP/2 410
#   curl -sI https://<preview>/page/7          | head -1      → HTTP/2 410
[[redirects]]
  from = "/aenderungen-2019"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/ampel-kabinett-nach-73-tagen-im-amt"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/neue-regelungen-ab-juli-2025"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/neue-gesetzes-und-pflichtaenderungen-ab-2026"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/hochwasserschutz-kann-fuer-europa-kostspielig-werden"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/ruv-versicherung-kuendigen"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/ovag-versicherung"
  to = "/410.html"
  status = 410
  force = true

# Alte Blog-Paginierung der Vorgaenger-Seite (/page/1 … /page/19)
[[redirects]]
  from = "/page/*"
  to = "/410.html"
  status = 410
  force = true

[build.environment]
  # 22 (LTS): Netlify verlangt für Build-Plugins Node >= 22 — sonst wird das
  # warm-cache-Plugin übersprungen (Post-Deploy-Warming läuft dann nicht).
  NODE_VERSION = "22"
  # LEO-Backend des Kunden (RAG-Service auf Heroku). /api/chat proxyt darauf.
  # Gilt für alle Kontexte (Staging, Previews, Production) — ein einziges Backend.
  # Falls der Kunde später eine separate Prod-URL liefert: in [context.production.environment] überschreiben.
  LEO_BACKEND_URL = "https://leo-finanzleser-ea7e1549925c.herokuapp.com"

# Production-Site (deployt vom main-Branch, später)
[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://www.finanzleser.de"
  # WORDPRESS_API_URL wird im Netlify-UI gesetzt (Production-WP-Endpoint)

# Staging-Site (deployt vom staging-Branch)
[context.staging.environment]
  NEXT_PUBLIC_SITE_URL = "https://staging.finanzleser.de"
  WORDPRESS_API_URL = "https://staging.finanzleser.de/graphql"
  # Echte AdSense-Ads (Testmodus data-adtest kommt automatisch über die
  # Staging-URL). Production bekommt das Flag erst mit der Live-Freigabe.
  NEXT_PUBLIC_ADSENSE = "1"

# Deploy-Previews und Branch-Deploys
[context.deploy-preview.environment]
  WORDPRESS_API_URL = "https://staging.finanzleser.de/graphql"
  NEXT_PUBLIC_SITE_URL = "https://staging.finanzleser.de"
  NEXT_PUBLIC_ADSENSE = "1"

# Hinweis: noindex-Header für Staging wird in next.config.ts gesetzt
# (env-basiert über NEXT_PUBLIC_SITE_URL — funktioniert verlässlich
# bei Next.js SSR, anders als ein netlify.toml [[headers]] Block).
