<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes fl-tickA{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes fl-tickB{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes fl-hand{0%,100%{transform:translateX(-5px);opacity:.5}50%{transform:translateX(5px);opacity:1}}
</style>
</helmet>
<div ref="{{setEl}}" tabIndex="0" role="slider" aria-valuenow="{{wert}}" aria-label="{{label}}" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" onWheel="{{rad}}" onKeyDown="{{taste}}" style="position:relative;user-select:none;touch-action:none;cursor:{{cursor}};outline:0;min-width:0">
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;min-height:14px">
    <span style="font:700 10.5px/1.3 'Open Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:{{kickerFarbe}};transition:color .3s">{{label}}</span>
    <span style="display:{{bereichDisplay}};font:italic 300 12px 'Merriweather',Georgia,serif;color:#686C6A;white-space:nowrap">{{bereich}}</span>
    <span style="display:{{hintDisplay}};align-items:center;gap:6px;font:italic 300 12px 'Merriweather',Georgia,serif;color:#686C6A;white-space:nowrap"><i style="display:inline-block;width:12px;height:1px;background:currentColor;animation:fl-hand 1.8s ease-in-out infinite"></i>ziehen · Marke antippen · tippen</span>
  </div>
  <div style="display:flex;justify-content:center;align-items:baseline;gap:7px;height:40px;margin-top:2px;animation:{{bubbleAnim}}">
    <input value="{{wertText}}" onFocus="{{fokus}}" onChange="{{tippen}}" onBlur="{{fertig}}" onKeyDown="{{tasteInput}}" onPointerDown="{{stopp}}" inputMode="decimal" aria-label="{{label}}" style="width:{{inputW}};text-align:center;border:0;border-bottom:1px dashed rgba(51,74,39,.3);background:transparent;font:700 26px/1.2 'Merriweather',Georgia,serif;color:#334A27;padding:0;outline:0;font-variant-numeric:tabular-nums;letter-spacing:-.01em;cursor:text" style-focus="border-bottom:1px solid #334A27">
    <span style="display:{{einheitDisplay}};font:italic 300 15px 'Merriweather',Georgia,serif;color:#686C6A">{{einheit}}</span>
  </div>
  <div style="position:relative;height:64px;margin-top:4px">
    <div style="position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)">
      <div style="position:absolute;left:0;top:0;width:{{trackW}}px;height:64px;transform:translateX({{offset}}px);transition:{{trans}}">
        <i style="position:absolute;left:0;right:0;top:20px;height:1px;background:#334A27"></i>
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="0">
          <i style="position:absolute;left:{{t.x}}px;top:20px;width:1px;height:{{t.h}}px;background:{{t.bg}}"></i>
        </sc-for>
        <sc-for list="{{labels}}" as="l" hint-placeholder-count="0">
          <button onPointerDown="{{stopp}}" onClick="{{l.klick}}" tabIndex="-1" style="position:absolute;left:{{l.x}}px;top:36px;transform:translateX(-50%);border:0;background:transparent;padding:4px 6px;font:500 11px 'Open Sans',sans-serif;color:#686C6A;white-space:nowrap;cursor:pointer;opacity:{{l.op}};transition:opacity .3s,color .2s;font-variant-numeric:tabular-nums" style-hover="color:#334A27">{{l.text}}</button>
        </sc-for>
      </div>
    </div>
    <i style="position:absolute;left:50%;top:-2px;width:0;height:0;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:6px solid {{farbe}}"></i>
    <i style="position:absolute;left:50%;top:4px;width:2px;height:22px;background:{{farbe}};transform:translateX(-50%);box-shadow:0 0 0 3px rgba(250,249,246,.9)"></i>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:130},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kreditsumme&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bereich&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1.000 – 100.000 €&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;wert&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:20000,&quot;tsType&quot;:&quot;number&quot;},&quot;min&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1000,&quot;tsType&quot;:&quot;number&quot;},&quot;max&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:100000,&quot;tsType&quot;:&quot;number&quot;},&quot;step&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:500,&quot;tsType&quot;:&quot;number&quot;},&quot;px&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:9,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Skala&quot;},&quot;major&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Skala&quot;},&quot;mittel&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Skala&quot;},&quot;einheit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;€&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dez&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;farbe&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0B7F66&quot;,&quot;options&quot;:[&quot;#0B7F66&quot;,&quot;#D3005E&quot;,&quot;#45A117&quot;,&quot;#334A27&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:number)=&gt;void&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: 0, drag: false, n: 0, hint: true, edit: null };
  setEl = (el) => { if (!el || this.el === el) return; this.el = el; this.ro = new ResizeObserver(() => this.setState({ w: el.clientWidth })); this.ro.observe(el); this.setState({ w: el.clientWidth }); };
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); }
  cfg() { const p = this.props; return { min: p.min ?? 0, max: p.max ?? 100, step: p.step ?? 1, px: p.px ?? 10, major: p.major ?? 10, mittel: p.mittel ?? 0, einheit: p.einheit ?? '', farbe: p.farbe ?? '#0B7F66', dez: p.dez ?? 0 }; }
  fmt(v) { const c = this.cfg(); return v.toLocaleString('de-DE', { minimumFractionDigits: c.dez, maximumFractionDigits: c.dez }); }
  setWert(v) { const c = this.cfg(); if (isNaN(v)) return; const r = Math.min(c.max, Math.max(c.min, Math.round(v / c.step) * c.step)); const fix = +r.toFixed(c.dez + 2); if (fix !== this.props.wert && this.props.onChange) { this.props.onChange(fix); this.setState(s => ({ n: s.n + 1 })); } }
  down = (e) => { if (e.button !== undefined && e.button !== 0) return; this.startX = e.clientX; this.startW = this.props.wert ?? 0; e.currentTarget.setPointerCapture(e.pointerId); this.setState({ drag: true, hint: false }); e.currentTarget.focus({ preventScroll: true }); };
  move = (e) => { if (!this.state.drag) return; const c = this.cfg(); this.setWert(this.startW - (e.clientX - this.startX) / c.px * c.step); };
  up = () => { if (this.state.drag) this.setState({ drag: false }); };
  stopp = (e) => { e.stopPropagation(); };
  rad = (e) => { const c = this.cfg(); const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; if (!d) return; e.preventDefault(); this.setWert((this.props.wert ?? 0) + (d > 0 ? c.step : -c.step)); this.setState({ hint: false }); };
  taste = (e) => { const c = this.cfg(); const w = this.props.wert ?? 0; if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); this.setWert(w + c.step * (e.shiftKey ? c.major : 1)); } if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); this.setWert(w - c.step * (e.shiftKey ? c.major : 1)); } };
  fokus = (e) => { const w = this.props.wert ?? 0; this.setState({ edit: String(w).replace('.', ','), hint: false }); requestAnimationFrame(() => e.target.select()); };
  tippen = (e) => { this.setState({ edit: e.target.value }); };
  fertig = () => { const raw = (this.state.edit ?? '').replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, ''); this.setWert(parseFloat(raw)); this.setState({ edit: null }); };
  tasteInput = (e) => { e.stopPropagation(); if (e.key === 'Enter') e.target.blur(); };
  renderVals() {
    const c = this.cfg(); const wert = this.props.wert ?? c.min; const w = this.state.w;
    const n = Math.round((c.max - c.min) / c.step); const trackW = n * c.px;
    const ticks = [], labels = [];
    for (let i = 0; i <= n; i++) {
      const x = i * c.px; const v = +(c.min + i * c.step).toFixed(6); const isMajor = Math.abs(v / (c.major * c.step) - Math.round(v / (c.major * c.step))) < 1e-6; const isMittel = c.mittel && Math.abs(v / (c.mittel * c.step) - Math.round(v / (c.mittel * c.step))) < 1e-6;
      ticks.push({ x, h: isMajor ? 14 : isMittel ? 9 : 5, bg: isMajor ? '#334A27' : 'rgba(51,74,39,.45)' });
      if (isMajor) labels.push({ x, text: this.fmt(v), op: Math.abs(v - wert) / c.step * c.px < 22 ? 0 : 1, klick: () => { this.setWert(v); this.setState({ hint: false }); } });
    }
    const wertText = this.state.edit ?? this.fmt(wert);
    const hint = this.state.hint && this.props.hint !== false;
    return {
      setEl: this.setEl, down: this.down, move: this.move, up: this.up, rad: this.rad, taste: this.taste, stopp: this.stopp, fokus: this.fokus, tippen: this.tippen, fertig: this.fertig, tasteInput: this.tasteInput,
      label: this.props.label ?? '', bereich: this.props.bereich ?? '', bereichDisplay: hint ? 'none' : 'inline', hintDisplay: hint ? 'inline-flex' : 'none',
      kickerFarbe: this.state.drag ? c.farbe : '#686C6A', trackW, ticks, labels, wert, farbe: c.farbe,
      offset: w / 2 - (wert - c.min) / c.step * c.px, trans: this.state.drag ? 'none' : 'transform .55s cubic-bezier(.2,.8,.2,1)', cursor: this.state.drag ? 'grabbing' : 'grab',
      wertText, inputW: (Math.max(2, wertText.length) + .6) + 'ch', einheit: c.einheit, einheitDisplay: c.einheit ? 'inline' : 'none', bubbleAnim: `fl-tick${this.state.n % 2 ? 'A' : 'B'} .3s ease-out`,
    };
  }
}
</script>
</body>
</html>
