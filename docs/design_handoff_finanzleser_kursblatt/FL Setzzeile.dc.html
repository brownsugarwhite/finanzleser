<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes fl-setz{0%{transform:scaleX(0);opacity:1}45%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes fl-setz2{0%{transform:scaleX(0);opacity:1}45%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes fl-druck{0%{opacity:0;transform:translateY(5px);letter-spacing:.06em;filter:blur(.6px)}60%{opacity:1;letter-spacing:.01em;filter:blur(0)}100%{opacity:1;transform:none;letter-spacing:normal}}
</style>
</helmet>
<div style="position:relative;min-width:0">
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;min-height:14px">
    <span style="font:700 10.5px/1.3 'Open Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:{{kickerFarbe}};transition:color .3s">{{label}}</span>
    <span style="font:italic 300 12px 'Merriweather',Georgia,serif;color:#686C6A;white-space:nowrap">{{bereich}}</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:7px;height:40px;margin-top:2px">
    <input value="{{text}}" placeholder="{{platzhalter}}" inputMode="decimal" onFocus="{{fokus}}" onBlur="{{fertig}}" onChange="{{tippen}}" onKeyDown="{{taste}}" aria-label="{{label}}" style="flex:0 1 auto;width:{{inputW}};min-width:2ch;max-width:100%;border:0;background:transparent;font:700 26px/1.2 'Merriweather',Georgia,serif;color:{{textFarbe}};outline:0;padding:0;font-variant-numeric:tabular-nums;letter-spacing:-.01em;transition:color .3s">
    <span style="display:{{einheitDisplay}};font:italic 300 15px 'Merriweather',Georgia,serif;color:#686C6A;flex-shrink:0">{{einheit}}</span>
    <span style="flex:1"></span>
    <div style="display:flex;gap:2px;align-self:center;opacity:{{stepOp}};transition:opacity .3s">
      <button onClick="{{minus}}" tabIndex="-1" aria-label="weniger" style="width:32px;height:32px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:#686C6A;cursor:pointer;transition:color .2s" style-hover="color:#334A27"><i style="width:7px;height:7px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-left:3px"></i></button>
      <button onClick="{{plus}}" tabIndex="-1" aria-label="mehr" style="width:32px;height:32px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:#686C6A;cursor:pointer;transition:color .2s" style-hover="color:#334A27"><i style="width:7px;height:7px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-135deg);margin-right:3px"></i></button>
    </div>
  </div>
  <div style="position:relative;height:5px">
    <i style="position:absolute;left:0;right:0;top:0;height:1px;background:rgba(51,74,39,.35)"></i>
    <i style="position:absolute;left:0;right:0;top:-1px;height:2px;background:{{linieFarbe}};transform:scaleX({{linieX}});transform-origin:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s"></i>
    <i style="position:absolute;left:0;right:0;top:3px;height:1px;background:{{linieFarbe}};transform:scaleX({{linieX}});transform-origin:center;transition:transform .45s cubic-bezier(.2,.8,.2,1) .08s,background .3s"></i>
    <i style="position:absolute;left:0;right:0;top:-1px;height:2px;background:#45A117;transform-origin:center;opacity:0;animation:{{setzAnim}}"></i>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-top:7px;min-height:16px">
    <span style="font:italic 300 12px 'Merriweather',Georgia,serif;color:{{hinweisFarbe}};animation:{{hinweisAnim}};min-width:0">{{hinweisText}}</span>
    <div style="display:flex;gap:12px;flex-wrap:wrap;opacity:{{vorOp}};pointer-events:{{vorEvents}};transition:opacity .3s">
      <sc-for list="{{vorschlaegeV}}" as="v" hint-placeholder-count="0"><button onMouseDown="{{halten}}" onClick="{{v.klick}}" style="border:0;background:transparent;padding:0 0 1px;font:500 12px 'Open Sans',sans-serif;color:#686C6A;border-bottom:1px dotted rgba(51,74,39,.5);cursor:pointer;transition:color .2s" style-hover="color:#334A27">{{v.label}}</button></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:96},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Anlagebetrag&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bereich&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;500 – 500.000 €&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;wert&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:20000,&quot;tsType&quot;:&quot;number&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:number)=&gt;void&quot;},&quot;einheit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;€&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;min&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;max&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:500000,&quot;tsType&quot;:&quot;number&quot;},&quot;step&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:500,&quot;tsType&quot;:&quot;number&quot;},&quot;dez&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;farbe&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0B7F66&quot;,&quot;options&quot;:[&quot;#0B7F66&quot;,&quot;#D3005E&quot;,&quot;#45A117&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;vorschlag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;z. B. 20.000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;vorschlaege&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[5000,10000,20000,50000],&quot;tsType&quot;:&quot;number[]&quot;},&quot;vorschlaegeImmer&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;stepper&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hinweis&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { edit: null, fokus: false, ok: 0 };
  cfg() { const p = this.props; return { min: p.min ?? 0, max: p.max ?? 1e9, step: p.step ?? 1, dez: p.dez ?? 0, farbe: p.farbe ?? '#0B7F66', einheit: p.einheit ?? '' }; }
  fmt(v) { const c = this.cfg(); return v.toLocaleString('de-DE', { minimumFractionDigits: c.dez, maximumFractionDigits: c.dez }); }
  parse(s) { return parseFloat(String(s).replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '')); }
  setWert(v) { const c = this.cfg(); if (isNaN(v)) return; const r = +Math.min(c.max, Math.max(c.min, v)).toFixed(c.dez); if (this.props.onChange && r !== this.props.wert) this.props.onChange(r); this.setState(s => ({ ok: s.ok + 1 })); }
  fokus = e => { const w = this.props.wert; this.setState({ edit: w == null ? '' : String(w).replace('.', ','), fokus: true }); requestAnimationFrame(() => e.target.select()); };
  tippen = e => this.setState({ edit: e.target.value.replace(/[^\d.,]/g, '') });
  fertig = () => { if (this.state.edit !== '') this.setWert(this.parse(this.state.edit)); this.setState({ edit: null, fokus: false }); };
  taste = e => { const c = this.cfg(); if (e.key === 'Enter') e.target.blur(); if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); const cur = this.state.edit !== null && this.state.edit !== '' ? this.parse(this.state.edit) : (this.props.wert ?? c.min); const nv = Math.min(c.max, Math.max(c.min, cur + (e.key === 'ArrowUp' ? c.step : -c.step) * (e.shiftKey ? 10 : 1))); this.setState({ edit: String(+nv.toFixed(c.dez)).replace('.', ',') }); } };
  minus = () => { const c = this.cfg(); this.setWert((this.props.wert ?? c.min) - c.step); };
  plus = () => { const c = this.cfg(); this.setWert((this.props.wert ?? c.min) + c.step); };
  halten = e => e.preventDefault();
  renderVals() {
    const c = this.cfg(); const s = this.state; const wert = this.props.wert;
    const live = s.edit !== null && s.edit !== '' ? this.parse(s.edit) : null;
    let fehler = null;
    if (live !== null && !isNaN(live)) { if (live > c.max) fehler = `Höchstens ${this.fmt(c.max)} ${c.einheit}`.trim(); else if (live < c.min) fehler = `Mindestens ${this.fmt(c.min)} ${c.einheit}`.trim(); }
    const aktiv = s.fokus; const text = s.edit !== null ? s.edit : (wert == null ? '' : this.fmt(wert));
    return {
      label: this.props.label ?? '', bereich: this.props.bereich ?? '', einheit: c.einheit, einheitDisplay: c.einheit ? 'inline' : 'none', platzhalter: this.props.vorschlag ?? '', text,
      inputW: (Math.max(2, text.length || (this.props.vorschlag || '').length) + .6) + 'ch',
      fokus: this.fokus, tippen: this.tippen, fertig: this.fertig, taste: this.taste, minus: this.minus, plus: this.plus, halten: this.halten,
      kickerFarbe: fehler ? '#D3005E' : aktiv ? c.farbe : '#686C6A', textFarbe: fehler ? '#D3005E' : '#334A27',
      linieFarbe: fehler ? '#D3005E' : c.farbe, linieX: aktiv ? 1 : 0, stepOp: aktiv || this.props.stepper ? 1 : .45,
      setzAnim: s.ok && !aktiv ? `fl-setz${s.ok % 2 ? '' : '2'} .9s cubic-bezier(.2,.8,.2,1) both` : 'none',
      hinweisText: fehler ?? (this.props.hinweis ?? ''), hinweisFarbe: fehler ? '#D3005E' : '#686C6A', hinweisAnim: fehler ? 'fl-druck .4s both' : 'none',
      vorschlaegeV: (this.props.vorschlaege || []).map(v => ({ label: this.fmt(v), klick: () => { this.setWert(v); this.setState({ edit: null }); } })),
      vorOp: aktiv || this.props.vorschlaegeImmer ? 1 : 0, vorEvents: aktiv || this.props.vorschlaegeImmer ? 'auto' : 'none',
    };
  }
}
</script>
</body>
</html>
