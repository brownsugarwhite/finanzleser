<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#faf9f6;color:#334A27;font-family:'Open Sans',sans-serif}
input,button{font:inherit;color:inherit}
input::placeholder{color:#9a9e9b;font:italic 300 15px 'Merriweather',Georgia,serif}
@keyframes fl-az-knoten{0%{transform:scale(0)}60%{transform:scale(1.6)}100%{transform:scale(1)}}
@keyframes fl-az-knoten2{0%{transform:scale(0)}60%{transform:scale(1.6)}100%{transform:scale(1)}}
@keyframes fl-az-flug{0%{transform:translate(0,0) rotate(0)}55%{transform:translate(18px,-16px) rotate(-14deg);opacity:1}100%{transform:translate(64px,-70px) rotate(-28deg) scale(.5);opacity:0}}
@keyframes fl-az-schuettel{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes fl-az-schuettel2{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes fl-az-druck{0%{opacity:0;transform:translateY(6px);letter-spacing:.05em;filter:blur(.6px)}60%{opacity:1;letter-spacing:.005em;filter:blur(0)}100%{opacity:1;transform:none;letter-spacing:normal}}
@keyframes fl-az-haken{to{stroke-dashoffset:0}}
@keyframes fl-az-at{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
</style>
</helmet>
<div style="font-family:'Open Sans',sans-serif;color:#334A27;animation:{{wackelAnim}}">
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:14px">
    <label for="{{id}}" style="font:700 10.5px/1.3 'Open Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:{{labelFarbe}};transition:color .25s">{{label}}</label>
    <span style="font:italic 300 12px 'Merriweather',Georgia,serif;color:{{statusFarbe}};transition:color .25s;animation:{{statusAnim}}">{{status}}</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;align-items:stretch;gap:10px 12px;margin-top:2px">
    <div style="position:relative;flex:1 1 200px;min-width:0;height:44px">
      <input id="{{id}}" type="{{type}}" inputMode="{{inputMode}}" autoComplete="{{autoComplete}}" value="{{wert}}" placeholder="{{placeholder}}" onChange="{{tippen}}" onFocus="{{fokusAn}}" onBlur="{{fokusAus}}" onKeyDown="{{taste}}" disabled="{{gesperrt}}" style="width:100%;height:44px;border:0;outline:0;background:transparent;padding:0 22px 0 0;font:400 16px 'Open Sans',sans-serif;color:#334A27;box-sizing:border-box;opacity:{{textOp}};transform:translateY({{textY}});transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)">
      <i style="position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(51,74,39,.3)"></i>
      <i style="position:absolute;left:0;bottom:0;height:1px;width:{{fortschritt}};background:{{farbe}};transition:width .5s cubic-bezier(.2,.8,.2,1)"></i>
      <i style="position:absolute;left:0;right:0;bottom:-1px;height:2px;background:{{linieFarbe}};transform-origin:center;transform:scaleX({{fokusS}});transition:transform .45s cubic-bezier(.2,.8,.2,1),background .25s"></i>
      <i style="position:absolute;left:0;right:0;bottom:-5px;height:1px;background:{{linieFarbe}};transform-origin:center;transform:scaleX({{fokusS}});transition:transform .45s cubic-bezier(.2,.8,.2,1) .08s,background .25s"></i>
      <i style="position:absolute;right:-3px;bottom:-4px;width:9px;height:9px;border-radius:50%;background:#45A117;box-shadow:0 0 0 2px #faf9f6;opacity:{{knotenOp}};animation:{{knotenAnim}};transition:opacity .2s"></i>
      <span style="position:absolute;left:0;top:0;height:44px;display:{{fertigDisplay}};align-items:center;gap:9px;font:italic 400 15.5px 'Merriweather',Georgia,serif;color:#2E7A0B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;animation:fl-az-druck .6s cubic-bezier(.2,.8,.2,1) .35s both"><svg width="14" height="12" viewBox="0 0 14 12" fill="none" style="flex-shrink:0"><path d="M1.5 6.5l3.6 3.6L12.5 1.8" stroke="#45A117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:fl-az-haken .5s cubic-bezier(.2,.8,.2,1) .6s forwards"></path></svg><span style="overflow:hidden;text-overflow:ellipsis">{{fertigText}}</span></span>
    </div>
    <button type="button" onClick="{{senden}}" disabled="{{gesperrt}}" style="display:{{knopfDisplay}};align-items:center;gap:12px;height:44px;padding:3px 3px 3px 16px;border:1.5px solid {{knopfRand}};border-radius:19px;background:{{knopfBg}};color:{{knopfFarbe}};font:500 14px 'Open Sans',sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0;margin-left:auto;transition:border-color .3s,background .3s,color .3s,transform .3s cubic-bezier(.34,1.56,.64,1);transform:scale({{knopfScale}})" style-hover="border-color:#334A27"><span>{{knopfText}}</span><span style="position:relative;width:34px;height:34px;border-radius:15px;background:{{kreisBg}};display:flex;align-items:center;justify-content:center;transition:background .3s;overflow:visible"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="display:{{flugDisplay}};animation:{{flugAnim}}"><path d="M3 11.5 21 3l-7.5 18-3-7.5L3 11.5Z" fill="#fff"></path><path d="M10.5 13.5 21 3" stroke="{{kreisBg}}" stroke-width="1.6"></path></svg><svg width="14" height="12" viewBox="0 0 14 12" fill="none" style="display:{{hakenDisplay}}"><path d="M1.5 6.5l3.6 3.6L12.5 1.8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:fl-az-haken .5s cubic-bezier(.2,.8,.2,1) .1s forwards"></path></svg></span></button>
  </div>
  <div style="display:flex;justify-content:space-between;gap:10px;margin-top:9px;min-height:16px"><span style="font:italic 300 12px/1.4 'Merriweather',Georgia,serif;color:{{hinweisFarbe}};transition:color .25s;animation:{{hinweisAnim}}">{{hinweisText}}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:120},
&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;E-Mail&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Text&quot;},
&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ihre@adresse.de&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Text&quot;},
&quot;knopf&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Eintragen&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Text&quot;},
&quot;hinweis&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Text&quot;},
&quot;hinweisFertig&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bestätigung kommt gleich per E-Mail. Ein Klick, fertig.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Text&quot;},
&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;email&quot;,&quot;options&quot;:[&quot;email&quot;,&quot;text&quot;,&quot;tel&quot;],&quot;tsType&quot;:&quot;'email'|'text'|'tel'&quot;,&quot;section&quot;:&quot;Verhalten&quot;},
&quot;farbe&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2E7A0B&quot;,&quot;options&quot;:[&quot;#2E7A0B&quot;,&quot;#0B7F66&quot;,&quot;#D3005E&quot;,&quot;#334A27&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Farbe&quot;},
&quot;onSenden&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(wert:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { wert: '', fokus: false, phase: 'idle', fehler: false, wackel: 0, knotenLauf: 0, warGueltig: false };
  id = 'az' + Math.random().toString(36).slice(2, 7);
  stufen(v, type) {
    const t = v.trim(); if (!t) return 0;
    if (type !== 'email') return Math.min(4, Math.ceil(t.replace(/\s/g, '').length / (type === 'tel' ? 2.5 : 1.5)));
    let n = 1; const at = t.indexOf('@'); if (at > 0) n = 2; if (at > 0 && t.slice(at + 1).length > 0) n = 3;
    if (/^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(t)) n = 4; return n;
  }
  renderVals() {
    const p = this.props, s = this.state;
    const farbe = p.farbe ?? '#2E7A0B', type = p.type ?? 'email';
    const stufe = this.stufen(s.wert, type), gueltig = stufe === 4;
    const fertig = s.phase === 'fertig', flug = s.phase === 'flug', vorbei = fertig || flug;
    const linieFarbe = s.fehler ? '#D3005E' : farbe;
    const knopf = p.knopf ?? 'Eintragen';
    const hinweis = s.fehler ? (type === 'email' ? 'Bitte eine vollständige Adresse, z. B. name@adresse.de' : 'Bitte ausfüllen') : (fertig ? (p.hinweisFertig ?? 'Bestätigung kommt gleich per E-Mail. Ein Klick, fertig.') : (p.hinweis ?? ''));
    return {
      id: this.id, type: type === 'tel' ? 'tel' : type === 'email' ? 'email' : 'text', inputMode: type === 'tel' ? 'tel' : type === 'email' ? 'email' : 'text', autoComplete: type === 'email' ? 'email' : type === 'tel' ? 'tel' : 'name',
      label: p.label ?? 'E-Mail', placeholder: p.placeholder ?? 'ihre@adresse.de', wert: s.wert, farbe,
      labelFarbe: s.fehler ? '#D3005E' : (s.fokus || vorbei ? farbe : '#686C6A'),
      status: fertig ? 'Eingetragen' : flug ? 'Unterwegs …' : gueltig ? 'sieht gut aus' : (s.fokus && stufe > 0 && type === 'email' ? ['', 'Name', 'jetzt die Domain', 'noch die Endung'][stufe] : ''),
      statusFarbe: gueltig || vorbei ? '#2E7A0B' : '#686C6A', statusAnim: `fl-az-druck .4s both`,
      fortschritt: vorbei ? '100%' : (stufe / 4 * 100) + '%',
      linieFarbe, fokusS: s.fokus || s.fehler ? 1 : 0,
      knotenOp: gueltig || vorbei ? 1 : 0, knotenAnim: gueltig || vorbei ? `fl-az-knoten${s.knotenLauf % 2 ? '2' : ''} .5s cubic-bezier(.34,1.56,.64,1) both` : 'none',
      textOp: vorbei ? 0 : 1, textY: vorbei ? '-14px' : '0', gesperrt: vorbei,
      fertigDisplay: fertig ? 'flex' : 'none', fertigText: s.wert,
      knopfDisplay: knopf ? 'inline-flex' : 'none', knopfText: fertig ? 'Eingetragen' : flug ? 'Unterwegs' : knopf,
      knopfRand: gueltig || vorbei ? '#334A27' : 'rgba(51,74,39,.35)', knopfBg: fertig ? '#334A27' : 'transparent', knopfFarbe: fertig ? '#faf9f6' : '#334A27', knopfScale: flug ? .96 : 1,
      kreisBg: fertig ? '#45A117' : (gueltig ? farbe : 'rgba(51,74,39,.3)'),
      flugDisplay: fertig ? 'none' : 'block', flugAnim: flug ? 'fl-az-flug .8s cubic-bezier(.4,0,.6,1) forwards' : 'none', hakenDisplay: fertig ? 'block' : 'none',
      hinweisText: hinweis, hinweisFarbe: s.fehler ? '#D3005E' : '#686C6A', hinweisAnim: s.fehler || fertig ? 'fl-az-druck .45s both' : 'none',
      wackelAnim: s.fehler ? `fl-az-schuettel${s.wackel % 2 ? '2' : ''} .45s cubic-bezier(.2,.8,.2,1) both` : 'none',
      tippen: e => { const v = e.target.value; const g = this.stufen(v, type) === 4; this.setState(x => ({ wert: v, fehler: false, knotenLauf: g && !x.warGueltig ? x.knotenLauf + 1 : x.knotenLauf, warGueltig: g })); },
      fokusAn: () => this.setState({ fokus: true }), fokusAus: () => this.setState({ fokus: false }),
      taste: e => { if (e.key === 'Enter') this.senden(); },
      senden: () => this.senden()
    };
  }
  senden() {
    const type = this.props.type ?? 'email';
    if (this.state.phase !== 'idle') return;
    if (this.stufen(this.state.wert, type) !== 4) { this.setState(x => ({ fehler: true, wackel: x.wackel + 1 })); return; }
    this.setState({ phase: 'flug', fokus: false });
    clearTimeout(this._t); this._t = setTimeout(() => { this.setState({ phase: 'fertig' }); if (typeof this.props.onSenden === 'function') this.props.onSenden(this.state.wert); }, 850);
  }
  componentWillUnmount() { clearTimeout(this._t); }
}
</script>
</body>
</html>
