<text x="1110" y="524.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· dünne Linien statt Schatten, keine gerundeten Kästen</text>
<text x="1110" y="542.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Serif-Titel in drei Größen, Kicker in Kapitälchen</text>
<text x="1110" y="559.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Farbe nur für Aktionen (Grün) und Spiele (Magenta)</text>
<text x="1110" y="577.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· eine Textspalte von 64 Zeichen, Kästen für Werkzeuge</text>
