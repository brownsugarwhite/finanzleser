<text x="163.0" y="387" font-size="12" fill="#1F2937" font-weight="600" text-anchor="middle">Kurzfassung von Leo</text>
<text x="263" y="387" font-size="10.5" fill="#6B7280" font-weight="400" text-anchor="start">Die Kette ist immer ganz ausgerollt. Die Inhalt-Chips springen zum Abschnitt.</text>
