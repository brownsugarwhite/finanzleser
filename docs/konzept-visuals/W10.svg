<text x="40" y="46" font-size="22" fill="#1F2937" font-weight="700" text-anchor="start">W10 · Der Ratgeber als Kartenkette: Kopfkarte, Abschnitte, Fragen an Leo, Wochenbrief</text>
<text x="40" y="74" font-size="15" fill="#6B7280" font-weight="400" text-anchor="start">Der ganze Artikel steht immer ausgerollt im Faden. Die Kopfkarte zeigt Kurzfassung und Inhalt, die Chips springen zu den Abschnitten.</text>
