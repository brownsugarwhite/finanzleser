<text x="836" y="740" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">▸ Versicherungen</text>
<text x="836" y="762" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">▸ Versicherungen › Haftpflicht</text>
<text x="836" y="784" font-size="11" fill="#1F2937" font-weight="700" text-anchor="start">● Schlüsselverlust: Wann die Haftpflicht zahlt</text>
<text x="836" y="806" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">  Aktenkoffer (1) · Wochenbrief: eingetragen</text>
