<text x="510" y="901" font-size="10" fill="#6B7280" font-weight="400" text-anchor="start">ihre@adresse.de</text>
<rect x="658" y="882" width="84" height="30" rx="15" fill="#45A117" stroke="#45A117" stroke-width="1.5"/>
<text x="700.0" y="901" font-size="11" fill="white" font-weight="700" text-anchor="middle">Eintragen</text>
<rect x="820" y="130" width="740" height="106.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="830" y="148.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Aufbau der Kette (aus dem heutigen Artikel automatisch ableitbar):</text>
<text x="830" y="165.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Kopfkarte: Brotkrumen, Titel, Bild, Kurzfassung, Lesezeit, Inhalt als Sprung-Chips, „Kurzfassung von Leo“</text>
<text x="830" y="182.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Abschnittskarten je Zwischenüberschrift, immer ausgerollt; Rechner, Checklisten, Vergleiche, Spiele stehen als Kästen in der Kette</text>
<text x="830" y="200.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· nach jedem Abschnitt eine Frage an Leo („Weiterlesen mit Leo“), nie ein Pop-up</text>
<text x="830" y="217.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· FAQ-Karte, Fazit-Karte, dann Wochenbrief-Karte und „Dazu passt“ (zwei Teaser)</text>
<rect x="820" y="290" width="740" height="88.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="830" y="308.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Teilen:</text>
<text x="830" y="325.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· „Teilen“ kopiert die Adresse des Ratgebers. Wer sie öffnet, landet im Faden, Kette ausgerollt.</text>
<text x="830" y="342.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· „Abschnitt teilen“ hängt die Stelle an: …/schluesselverlust/#sofort-tun. Der Faden springt dorthin.</text>
<text x="830" y="360.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Die Adresse selbst ist ein Baustein für Suchmaschinen und KI-Suche. Ein Mensch sieht sie nur als Faden.</text>
<rect x="820" y="420" width="740" height="106.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="830" y="438.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Lesen ohne Überforderung:</text>
<text x="830" y="455.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Die Kette ist immer ganz da, wie ein Zeitungsartikel. Die Kopfkarte ist der Vorspann, die Chips das Inhaltsverzeichnis</text>
<text x="830" y="472.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Wer aus dem Wochenbrief oder von Google kommt, landet an der richtigen Stelle</text>
<text x="830" y="490.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· „Kurzfassung von Leo“: drei Sätze mit Quelle, dann die Frage, ob er vorlesen soll</text>
<text x="830" y="507.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Ältere Kapitel im Faden falten sich zur Kopfzeile, das offene Kapitel bleibt ruhig</text>
<rect x="820" y="550" width="740" height="88.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="830" y="568.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Wochenbrief als Ausgabe des Fadens:</text>
<text x="830" y="585.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Donnerstags legt Leo die Ausgabe (3 Themen, die Finanzfrage der Woche) als Karte in den Faden</text>
<text x="830" y="602.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Wer eingetragen ist, bekommt sie zusätzlich per E-Mail; jeder Link führt in den Faden</text>
<text x="830" y="620.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Eintragen an drei Stellen: Register-Knopf, Verlauf, Ende jeder Kette. Ein Feld, kein Formular.</text>
<rect x="820" y="690" width="740" height="150" rx="12" fill="#FFFFFF" stroke="#C7CCD4" stroke-width="1.5"/>
