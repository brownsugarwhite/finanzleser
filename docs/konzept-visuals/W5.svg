<text x="50" y="778.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Es gibt keine separate Magazinseite mehr. Die Adresse liefert den Faden mit der Kartenkette, vollständig im HTML.</text>
<text x="50" y="795.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Ein Mensch sieht deshalb nie eine andere Seite als den Faden. Der Zurück-Knopf schließt die zuletzt geöffnete Karte.</text>
<text x="50" y="812.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Teilen-Link = dieselbe Adresse; „Abschnitt teilen“ hängt die Stelle an (…/schluesselverlust/#sofort-tun).</text>
<rect x="820" y="760" width="740" height="70.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="830" y="778.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Der Wächter (WhatsApp/E-Mail) verlinkt genauso. Alle heutigen Links, Google-Treffer und Lesezeichen funktionieren weiter.</text>
<text x="830" y="795.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Suchmaschinen und KI-Suche lesen dieselbe Adresse: Kopfkarte, Abschnitte, FAQ, Fazit als semantischer Artikel.</text>
<text x="830" y="812.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Kein „App öffnen“, kein zweites System.</text>
