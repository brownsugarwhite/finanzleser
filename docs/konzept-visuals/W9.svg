<text x="40" y="619" font-size="9.5" fill="#6B7280" font-weight="700" text-anchor="start">KAPITEL 2 · VERSICHERUNGEN › TIER · 14:18</text>
<text x="40" y="641" font-size="15" fill="#1F2937" font-weight="700" text-anchor="start" font-family="Merriweather, Georgia, serif">Hundekrankenversicherung: OP-Schutz oder Vollschutz?</text>
