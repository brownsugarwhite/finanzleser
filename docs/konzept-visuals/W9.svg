<text x="74" y="708" font-size="9.5" fill="#45A117" font-weight="700" text-anchor="start">LEO</text>
<text x="40" y="731" font-size="12.5" fill="#1F2937" font-weight="400" text-anchor="start">Hier ist der Ratgeber, ganz ausgerollt. Fragen Sie mich zu jedem Abschnitt.</text>
