<rect x="1100" y="130" width="460" height="124.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="1110" y="148.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Warum das den Verlauf sauber hält:</text>
<text x="1110" y="165.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Das Blatt ist Teil der Kopfzeile, nicht des Fadens</text>
<text x="1110" y="182.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Auswahl → Blatt klappt ein, Inhalt kommt als Kapitel</text>
<text x="1110" y="200.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Register merkt sich den Ort: „Sie lesen: Versicherungen › Haftpflicht“</text>
<text x="1110" y="217.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Erneutes Tippen auf das Ressort öffnet das Blatt wieder</text>
<text x="1110" y="235.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Kein Rubrik-Sprung erzeugt jemals eine Karte im Faden</text>
<rect x="1100" y="300" width="460" height="124.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="1110" y="318.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Aufbau des Registerblatts (drei Spalten):</text>
<text x="1110" y="335.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· links Themen der Rubrik, „Alle 84 Ratgeber“ als Liste mit Filter</text>
<text x="1110" y="352.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Mitte: Neu und meistgelesen des gewählten Themas, als Zeitungsliste</text>
<text x="1110" y="370.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· rechts: Werkzeuge zum Thema (Rechner, Checkliste, Vergleich, Spiel) und Anbieter</text>
<text x="1110" y="387.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Finanztools: links die drei Reiter, Mitte die Liste, rechts Filter</text>
<text x="1110" y="405.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Mobil: Blatt fährt als Vollbild von oben ein, Themen als Reihe, Liste darunter</text>
<rect x="1100" y="490" width="460" height="70.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="1110" y="508.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Adresse: Das Blatt „Versicherungen“ ist zugleich die heutige Übersichtsseite</text>
<text x="1110" y="525.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">/versicherungen/. Suchmaschinen bekommen sie als Faden mit offenem Blatt.</text>
<text x="1110" y="542.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Für Menschen ist sie nur ein Zustand der Kopfzeile.</text>
<rect x="1100" y="600" width="460" height="106.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="1110" y="618.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Bedienung für Ältere:</text>
<text x="1110" y="635.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· ein Tipp öffnet, ein Tipp schließt, Esc schließt</text>
<text x="1110" y="652.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· keine Hover-Zustände, große Zeilen, klare Linien</text>
<text x="1110" y="670.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Leo sagt beim Öffnen nichts (kein Geplapper), erst bei der Auswahl</text>
<text x="1110" y="687.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Vorlesen: liest die Liste des Themas vor</text>
<rect x="1120" y="760" width="180" height="200" rx="28" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<rect x="1170.0" y="770" width="80" height="8" rx="4" fill="#1F2937" stroke="#1F2937" stroke-width="1.5"/>
