<text x="800" y="447" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">Im Thema filtern …</text>
<text x="788" y="489" font-size="10.5" fill="#6B7280" font-weight="400" text-anchor="start">Anbieter im Thema: Ammerländer, Haftpflichtkasse, VHV</text>
<text x="1036" y="239" font-size="10" fill="#6B7280" font-weight="400" text-anchor="end">Esc · außerhalb tippen · schließen ✕</text>
<text x="40" y="587" font-size="13" fill="#6B7280" font-weight="700" text-anchor="start">② Der Faden bleibt, wie er war: nur der gewählte Ratgeber kommt dazu, als neues Kapitel</text>
