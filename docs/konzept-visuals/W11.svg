<text x="754" y="311" font-size="11" fill="#1F2937" font-weight="400" text-anchor="start">Frau Berger · berger@mail.de</text>
<text x="754" y="331" font-size="11" fill="#1F2937" font-weight="400" text-anchor="start">Passkey eingerichtet · kein Passwort</text>
<text x="754" y="351" font-size="11" fill="#1F2937" font-weight="400" text-anchor="start">Interessen: Familie · Steuern · Hund</text>
