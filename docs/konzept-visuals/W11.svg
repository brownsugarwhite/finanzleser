<text x="52" y="703" font-size="9.5" fill="#45A117" font-weight="700" text-anchor="start">WÄCHTER MELDET</text>
<text x="52" y="719" font-size="11" fill="#1F2937" font-weight="400" text-anchor="start">Ihre Kfz-Wechselfrist endet in 58 Tagen. Am 1. November bringe ich drei geprüfte Angebote. </text>
<text x="1048" y="719" font-size="10" fill="#6B7280" font-weight="400" text-anchor="end">Regel ändern · Stumm</text>
<text x="40" y="753" font-size="9.5" fill="#6B7280" font-weight="700" text-anchor="start">KAPITEL 2 · AKTENKOFFER › BELEG · 14:05</text>
<text x="40" y="775" font-size="15" fill="#1F2937" font-weight="700" text-anchor="start" font-family="Merriweather, Georgia, serif">Unterhaltsrechner 2026 · 1.096 € / Monat</text>
<text x="40" y="793" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">Beleg vom 3. September, Nettoeinkommen 3.200 €, Kinder 6 und 9. Leo: „Soll ich mit dem Wert von Januar vergleichen?“</text>
<rect x="1100" y="130" width="460" height="124.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="1110" y="148.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Aktenkoffer als Mappe mit Belegen:</text>
<text x="1110" y="165.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· jeder Beleg: Titel, Wert oder Stand, Datum, Öffnen-Pfeil</text>
<text x="1110" y="182.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· kommt aus jedem Kasten und jeder Kette („In den Aktenkoffer“)</text>
<text x="1110" y="200.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Reiter: Ergebnisse · Checklisten · Vergleiche · Gespräche</text>
<text x="1110" y="217.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· ohne Konto im Browser, mit Konto gesichert (Stempel „gesichert“)</text>
<text x="1110" y="235.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Öffnen legt den Beleg als Kapitel in den Faden, Leo vergleicht mit früher</text>
<rect x="1100" y="300" width="460" height="124.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="1110" y="318.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Wächter als Regeln „Wenn … dann …“:</text>
<text x="1110" y="335.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Schalter je Regel, Kanal (E-Mail, WhatsApp, nur im Faden), nächster Termin</text>
<text x="1110" y="352.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Jahresleiste zeigt alle Termine auf einen Blick</text>
<text x="1110" y="370.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· entsteht aus jedem Kasten („Wächter setzen“) oder von Leo vorgeschlagen</text>
<text x="1110" y="387.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· meldet sich im Faden als eigene Zeile „Wächter meldet“, nie als Pop-up</text>
<text x="1110" y="405.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Zustellung nur, wenn etwas passiert; jede Meldung hat „Stumm“</text>
<rect x="1100" y="470" width="460" height="106.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="1110" y="488.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Warum ein Blatt und kein eigener Bereich:</text>
<text x="1110" y="505.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Verwalten oben (Blatt), Lesen unten (Faden), wie beim Register</text>
<text x="1110" y="522.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· nichts davon verlässt den Faden, kein zweites Layout</text>
<text x="1110" y="540.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· abgemeldet zeigt das Blatt die Sicherungsfrage (E-Mail oder Passkey)</text>
<text x="1110" y="557.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· mobil: Blatt als Vollbild mit drei Reitern</text>
<rect x="1100" y="620" width="460" height="88.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="1110" y="638.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Verspielte, schlichte Details:</text>
<text x="1110" y="655.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· gestrichelte Lochkante an jedem Beleg, Stempel „gesichert“</text>
<text x="1110" y="672.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Jahresleiste mit Punkten, Serie mit Flamme</text>
<text x="1110" y="690.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Kicker in Kapitälchen, dünne Linien, kein Schatten</text>
<rect x="40" y="958" width="14" height="14" rx="3" fill="#45A117" stroke="#45A117" stroke-width="1.5"/>
