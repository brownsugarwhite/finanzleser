<text x="50" y="838.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Regeln: Intro ist überspringbar (Klick/Tipp), respektiert „Bewegung reduzieren“, wird nach dem ersten Besuch gemerkt (localStorage) und dann auf Beat 4 verkürzt.</text>
<text x="50" y="855.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Beat 4 ist zugleich der Zustand, in dem ein Wiederbesucher und ein Suchmaschinen-Bot die Startseite sehen: Eingabe, Vorschläge, neue Karten, Magazin-Menü.</text>
