<text x="50" y="878.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Belohnungen zahlen aufs Maklergeschäft ein: Der „Versicherungs-Check“ ist ein Beratungstermin bei Finconext, freigeschaltet ab Level 2. Punkte sind nie Geld.</text>
<text x="50" y="895.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Jedes Spiel hat eine eigene Seite (/spiele/…), erscheint als Karte im Faden und kann in Ratgebern eingebettet bleiben.</text>
