<text x="1110" y="148.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Erlaubt, mit Regel:</text>
<text x="1110" y="165.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· rechte Spalte: ein 300×600 in der Fläche, dazu ein 300×250 sticky (≤ 30 % Bildschirm)</text>
<text x="1110" y="182.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· linke Spalte: 160×600 nur ab 1500 px, sonst leer</text>
<text x="1110" y="200.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· im Ratgeber: 300×250 (mobil 320×100) erst nach dem 2. Abschnitt, 500–800 Wörter Abstand</text>
<text x="1110" y="217.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· zwischen Kapiteln: 728×90 In-Feed, höchstens eine je zwei Kapitel</text>
<text x="1110" y="235.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· mobil unten: nur Googles eigenes Anchor-Format, Gesamtdichte ≤ 30 %</text>
<rect x="1100" y="300" width="460" height="106.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="1110" y="318.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Nie:</text>
<text x="1110" y="335.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· im Registerblatt oder Plus-Blatt (Navigationsfläche, kaum Inhalt)</text>
<text x="1110" y="352.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· direkt unter oder in Leos Antwort (Richtlinie „private Kommunikation“, Lage unklar)</text>
<text x="1110" y="370.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· im Intro und auf der Startseite ohne Text (Anzeige-zu-Inhalt-Verhältnis)</text>
<text x="1110" y="387.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· als Pop-up, Autoplay mit Ton, Countdown</text>
<rect x="1100" y="440" width="460" height="106.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="1110" y="458.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Kennzeichnung:</text>
<text x="1110" y="475.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· AdSense-Flächen nur „Anzeige“ oder „Werbung“, nie „Empfehlung“</text>
<text x="1110" y="492.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Partnerlinks: „Anzeige · Vergleich mit Partnerlinks“ im Kicker, vor dem Klick (OLG München 2025)</text>
<text x="1110" y="510.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Finconext-Kästen: „Anzeige in eigener Sache“, optisch abgesetzt (Magenta-Kante)</text>
<text x="1110" y="527.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· § 5a UWG, § 6 DDG, Pressekodex Ziffer 7</text>
<rect x="1100" y="600" width="460" height="106.0" rx="6" fill="#FFF8E1" stroke="#F59E0B" stroke-width="1"/>
<text x="1110" y="618.0" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">Bestand heute übernommen:</text>
<text x="1110" y="635.4" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Klassennamen adblocker-neutral (kein „ad“, „banner“, „sponsor“)</text>
<text x="1110" y="652.8" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Platzhalter-Optik mit AD-Marke oben links</text>
<text x="1110" y="670.2" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· IAB-Maße aus lib/ads.ts, Consent-Gating bleibt</text>
<text x="1110" y="687.6" font-size="12" fill="#7C5A00" font-weight="400" text-anchor="start">· Anzeigen laden erst, wenn das Kapitel im Bild ist</text>
