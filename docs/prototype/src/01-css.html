<title>Der Faden mit Leo</title>
<meta name="description" content="Klick-Prototyp: finanzleser.de als Faden im Zeitungsstil. Runde 6: Zeitungs-Intro mit Papierflieger, neuer Kopf mit Lesezeichen, Rubrikenwahl, Breitformat, Glossar-Nachschlagewerk, Belohnungen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Open+Sans:wght@400;600;700&display=swap">
<style>
  :root {

    --kopf-h: 64px; --rand-l: 300px; --rand-r: 300px; --spalte: 750px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #15181a; --white: #1c2022; --placeholder: #2a2f31; --rule: rgba(255,255,255,.14); --rule-soft: rgba(255,255,255,.08); --rule-strong: #e6ebe2; --ink: #e6ebe2; --muted: #a2a8a3; --green: #6BC63F; --green-ink: #8FDD6A; --pink: #FF4D95; --pink-tint: #33192A; --tint: #1e2a1a; --fill-1: #24301e; --fill-2: #22302a; --fill-3: #2e2b22; --fill-4: #2c2722; --note: #2b2712; --note-ink: #ebd58a; --note-line: #7a6420; --slot: rgba(255,255,255,.1); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #15181a; --white: #1c2022; --placeholder: #2a2f31; --rule: rgba(255,255,255,.14); --rule-soft: rgba(255,255,255,.08); --rule-strong: #e6ebe2; --ink: #e6ebe2; --muted: #a2a8a3; --green: #6BC63F; --green-ink: #8FDD6A; --pink: #FF4D95; --pink-tint: #33192A; --tint: #1e2a1a; --fill-1: #24301e; --fill-2: #22302a; --fill-3: #2e2b22; --fill-4: #2c2722; --note: #2b2712; --note-ink: #ebd58a; --note-line: #7a6420; --slot: rgba(255,255,255,.1); color-scheme: dark; }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.65 var(--sans); overflow-x: hidden; }
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 700; line-height: 1.22; margin: 0; text-wrap: balance; }
  button { font: inherit; cursor: pointer; color: inherit; }

  html.schnell *, html.schnell *::before, html.schnell *::after { transition: none !important; animation: none !important; }

  /* Typografische Bausteine */
  .kicker { font: 700 10.5px/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .kicker--gruen { color: var(--green-ink); } .kicker--pink { color: var(--pink); }
  .kicker--tool { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot--rechner { background: var(--tool-rechner); } .dot--vergleich { background: var(--tool-vergleich); } .dot--checkliste { background: var(--tool-checkliste); } .dot--dokumente { background: var(--tool-dokumente); }
  .dotline { height: 1px; background: var(--rule); }
  .spark { width: 12px; height: 12px; display: inline-block; flex: none; vertical-align: middle; transition: transform .4s; }
  .spark.dreht, .spark:hover { animation: spark-spin 4s linear infinite; }
  @keyframes spark-spin { to { transform: rotate(360deg); } }
  .textlink { border: 0; background: none; padding: 0; color: var(--green-ink); font-weight: 700; font-size: 13px; }

  .pfeil-link i { display: inline-block; width: 18px; height: 1.5px; background: currentColor; position: relative; transition: width .25s; }
  .pfeil-link i::after { content: ""; position: absolute; right: -1px; top: -4px; width: 8px; height: 8px; border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: rotate(45deg); }
  .pfeil-link:hover i, button:hover > .pfeil-link i { width: 30px; }
  .btn { border: 1px solid var(--rule-strong); background: transparent; color: var(--ink); border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn--primary { background: var(--green); border-color: var(--green); color: #fff; }

  .btn--still { border-color: var(--rule); color: var(--muted); }
  .chip { border: 1px solid var(--rule-strong); background: transparent; color: var(--ink); border-radius: 999px; padding: 5px 14px; font-weight: 600; font-size: 13.5px; text-align: left; }
  .chip:hover { background: var(--tint); border-color: var(--green-ink); color: var(--green-ink); }
  .chip--spiel { border-color: var(--pink); color: var(--pink); } .chip--spiel:hover { background: var(--pink-tint); color: var(--pink); border-color: var(--pink); }
  .chip--still { border-color: var(--rule); color: var(--muted); } .chip--leo { border-color: var(--green-ink); color: var(--green-ink); }
  .toggle { width: 38px; height: 20px; border-radius: 10px; border: 0; background: var(--rule); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--white); transition: left .2s; }
  .toggle.an { background: var(--green); } .toggle.an::after { left: 21px; }

  /* Glossar-Begriffe im Text + Klickmenü */
  .begriff { border: 0; background: none; padding: 0; font: inherit; color: var(--green); font-weight: 600; cursor: pointer; text-decoration: none; }
  .begriff:hover, .begriff.offen { color: var(--pink); text-decoration: none; }
  .bmenu { position: absolute; z-index: 45; width: 320px; background: var(--white); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 14px 34px rgba(51,74,39,.16); padding: 14px 18px 12px; display: none; }
  .bmenu.offen { display: grid; gap: 4px; }
  .bmenu.oben::before { top: auto; bottom: -7px; transform: rotate(225deg); }
  .bmenu::before { content: ""; position: absolute; left: var(--pfeil, 22px); top: -7px; width: 12px; height: 12px; background: var(--white); border-left: 1px solid var(--rule); border-top: 1px solid var(--rule); transform: rotate(45deg); }
  .bmenu__titel { font-family: var(--serif); font-weight: 700; font-size: 20px; color: var(--pink); padding-bottom: 8px; border-bottom: 1px solid var(--rule); margin-bottom: 4px; }
  .bmenu button.zeile { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 0; font-size: 15px; color: var(--ink); }
  .bmenu button.zeile:hover { color: var(--green-ink); }
  .bmenu button.zeile i { flex: none; }
  .bmenu .erkl { font-size: 14px; color: var(--ink); background: var(--tint); padding: 8px 10px; border-radius: 8px; margin: 2px 0 6px; }
  .bmenu .leo-zeile { border-top: 1px solid var(--rule); margin-top: 4px; padding-top: 8px; font-family: var(--serif); font-size: 16px; }
  .bmenu .leo-zeile img { width: 30px; height: 30px; margin-left: auto; }
  .bmenu .gemerkt { font-size: 11.5px; color: var(--muted); }

  /* Anzeigenplätze (adblocker-neutral benannt) */
  .einschub { display: grid; gap: 4px; justify-items: center; width: 100%; }
  .einschub[hidden] { display: none; }
  .einschub__label { font: 700 9.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); justify-self: start; }
  .einschub__flaeche { position: relative; width: 100%; display: block; line-height: 0; border: 1px solid var(--rule); }
  .einschub__flaeche img { width: 100%; height: auto; display: block; }
  .einschub__flaeche img.schmal { display: none; }
  .einschub--artikel { padding: 6px 0 10px; }
  .einschub[data-format="halfpage"] .einschub__flaeche, .einschub[data-format="rectangle"] .einschub__flaeche { max-width: 300px; }
  .einschub[data-format="leaderboard"] .einschub__flaeche { max-width: 728px; }
  .einschub[data-format="mobile"] .einschub__flaeche { max-width: 320px; }
  .einschub--feed { padding: 12px 0 16px; }
  .einschub--top { padding: 4px 0 18px; }
  /* Kassensturz im Zeitungsstil: Kopfzeile mit Stand, feine Fortschrittslinie, eine Frage groß in Serif, Antworten als Reihe mit
     Sparks. Die gewählte Antwort bekommt die dunkle Pille (wie das Register), dann wechselt die Bühne ruhig zur nächsten Frage. */
  .kasten--ks { padding: 22px 30px 28px; }
  .ks { display: grid; gap: 0; }
  .ks__kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .ks__stand { font: 600 10.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ks__fortschritt { height: 2px; background: var(--rule); margin: 10px 0 26px; overflow: hidden; } .ks__fortschritt i { display: block; height: 100%; background: var(--green); transition: width .55s cubic-bezier(.25,.46,.45,.94); }
  .ks__buehne { display: grid; gap: 18px; justify-items: center; text-align: center; transition: opacity .22s ease, transform .22s ease; }
  .ks__buehne.geht { opacity: 0; transform: translateY(-8px); }
  .ks__buehne.kommt { opacity: 0; transform: translateY(10px); transition: none; }
  .ks__frage { font: 700 23px/1.3 var(--serif); max-width: 30ch; letter-spacing: -.005em; }
  .ks__optionen { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 4px; }
  .ks__optionen .spark { color: var(--muted); opacity: .8; }
  .ks__option { position: relative; border: 0; background: none; padding: 9px 16px; font: 600 16px/1 var(--serif); color: var(--ink); cursor: pointer; transition: color .2s; z-index: 1; }
  .ks__option::before { content: ""; position: absolute; inset: 0; background: var(--ink); transform: scaleX(0); transform-origin: center; transition: transform .22s cubic-bezier(.25,.46,.45,.94); z-index: -1; }
  .ks__option:hover { color: var(--green-ink); }
  .ks__option.gewaehlt { color: var(--paper); } .ks__option.gewaehlt::before { transform: scaleX(1); }
  .ks__hinweis { font: 400 13px/1.4 var(--sans); color: var(--muted); }
  .ks__weiter { border: 0; background: none; color: var(--ink); font: 600 14px/1 var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px solid var(--ink); }
  .ks__weiter i { font-style: normal; color: var(--green); transition: transform .2s; } .ks__weiter:hover i { transform: translateX(3px); }
  .ks__still { border: 0; background: none; color: var(--muted); font: 400 13px/1 var(--sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .ks__schaetz { font: 700 34px/1 var(--serif); color: var(--green-ink); font-variant-numeric: tabular-nums; }
  .ks input[type=range] { width: min(420px, 100%); accent-color: var(--green); }
  .ks__aufloesung { font: 400 16px/1.5 var(--serif); max-width: 46ch; } .ks__aufloesung b { color: var(--green-ink); } .ks__aufloesung small { display: block; font: 400 12px/1.4 var(--sans); color: var(--muted); margin-top: 4px; }
  /* Ergebnis: Zierlinie, Profil als Vorspann, Ampel als Zeile, drei Lücken als Zeitungsspalten */
  .ks__zier { display: flex; align-items: center; gap: 14px; color: var(--muted); } .ks__zier i { width: 48px; height: 1px; background: var(--muted); opacity: .55; }
  .ks__profil { font: 400 19px/1.5 var(--serif); font-style: italic; max-width: 46ch; margin: 0; }
  .ks__ampel { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; }
  .ks__ampel span { font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--green-ink); display: inline-flex; align-items: center; gap: 7px; }
  .ks__ampel span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); } .ks__ampel span.rot { color: var(--pink); } .ks__ampel span.rot::before { background: var(--pink); }
  .ks__spalten { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; text-align: left; margin-top: 6px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .ks__spalte { padding: 16px 18px 18px; display: grid; gap: 8px; align-content: start; } .ks__spalte + .ks__spalte { border-left: 1px solid var(--rule); }
  .ks__nr { font: 400 30px/1 var(--serif); color: var(--pink); } .ks__spalte h4 { margin: 0; font: 700 16.5px/1.3 var(--serif); } .ks__spalte p { margin: 0; font-size: 14.5px; line-height: 1.5; }
  .ks__spalte .links { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
  .ks__spalte--gut .ks__nr { color: var(--green); }
  .ks__aktionen { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .ks__nachher { width: 100%; border-top: 1px solid var(--rule); padding-top: 18px; display: grid; gap: 10px; justify-items: center; text-align: center; }
  .ks__nachher p { margin: 0; max-width: 52ch; }
  .ks__nachher .reihe { justify-content: center; width: min(520px, 100%); } .ks__nachher .reihe input { flex: 1; min-width: 0; }
  .ks__nachher .wa { text-align: left; width: 100%; }
  .ks__rein { animation: ks-rein .5s cubic-bezier(.25,.46,.45,.94) both; }
  @keyframes ks-rein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  /* Weiterlesen mit Leo: Fragen am Ende des Abschnitts, Antwort klappt an Ort und Stelle auf */
  .weiterlesen { clear: both; display: grid; gap: 8px; margin-top: 4px; }
  .weiterlesen .fragen { display: flex; flex-wrap: wrap; gap: 6px; }
  .weiterlesen .fragen .chip.gewaehlt { opacity: .55; }
  .weiterlesen .antwort { border-left: 3px solid var(--green); background: var(--white); padding: 10px 14px 12px; display: grid; gap: 8px; }
  .weiterlesen .antwort .wort--frage { border: 0; padding: 0; background: none; }
  .weiterlesen .aktionen-w { display: flex; gap: 14px; flex-wrap: wrap; }
  .weiterlesen .merken { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 8px; }
  .weiterlesen form.reihe input { flex: 1; min-width: 0; }
  /* Leo auf WhatsApp: Nummer, Bestätigung mit JA, Vorschau der Nachricht */
  .wa { display: grid; gap: 10px; }
  .wa__kopf { display: flex; align-items: center; gap: 8px; font-weight: 700; } .wa__kopf i { width: 24px; height: 24px; border-radius: 50%; background: #25D366; display: grid; place-items: center; } .wa__kopf i svg { width: 15px; height: 15px; }
  .wa .reihe input { flex: 1; min-width: 0; }
  .wa__bubble { background: #e7ffdb; color: #111; border-radius: 12px 12px 12px 2px; padding: 10px 12px; font: 400 14px/1.45 var(--sans); max-width: 440px; }
  .wa__bubble small { display: block; color: #6b7a66; font-size: 11px; text-align: right; margin-top: 4px; }
  /* ---------- Runde 13: Abstände im Kasten ---------- */
  .kasten ul { margin: 2px 0 6px; padding-left: 20px; display: grid; gap: 5px; }
  .kasten ul + .btn, .kasten p + .btn { margin-top: 6px; }
  .kasten .btn + .quelle, .kasten .btn + p.quelle { margin-top: 12px; }
  .kasten .anbieter { display: grid; gap: 10px; justify-items: start; }
  .ikon { width: 20px; height: 20px; vertical-align: -5px; flex: none; }
  .kicker .ikon { width: 14px; height: 14px; vertical-align: -3px; margin-right: 4px; }
  /* ---------- Diagramme ---------- */
  .torte { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .torte__bild { width: 190px; flex: none; } .torte__bild svg { width: 100%; height: auto; display: block; }
  .torte__stueck { stroke: var(--white); stroke-width: 2.5; transform-origin: 100px 100px; transform-box: view-box; animation: torte-auf .55s cubic-bezier(.25,.46,.45,.94) both; transition: opacity .2s; cursor: default; }
  @keyframes torte-auf { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .torte__wert { font: 700 17px var(--sans); fill: var(--ink); } .torte__label { font: 600 9px var(--sans); letter-spacing: .1em; text-transform: uppercase; fill: var(--muted); }
  .torte__legende { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; flex: 1; min-width: 200px; }
  .torte__legende li { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 14px; padding: 4px 0; border-bottom: 1px solid var(--rule); cursor: default; }
  .torte__legende i { width: 12px; height: 12px; border-radius: 3px; } .torte__legende b { font-variant-numeric: tabular-nums; }
  .tacho { display: grid; justify-items: center; width: 180px; } .tacho svg { width: 180px; height: 100px; display: block; } .tacho__bogen { transition: stroke-dashoffset .1s linear; }
  .tacho__wert { margin-top: -38px; text-align: center; } .tacho__wert b { display: block; font: 700 30px/1 var(--serif); color: var(--ink); font-variant-numeric: tabular-nums; } .tacho__wert small { display: block; font: 600 10.5px/1.4 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .saeulen { display: grid; gap: 8px; } .saeulen__reihe { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 14px; align-items: end; border-bottom: 1px solid var(--rule-strong); padding: 0 6px; }
  .saeule { display: grid; justify-items: center; gap: 6px; } .saeule__stab { position: relative; width: 100%; max-width: 74px; height: 190px; display: flex; align-items: flex-end; } .saeule__stab i { display: block; width: 100%; height: 0; border-radius: 3px 3px 0 0; transition: height .7s cubic-bezier(.25,.46,.45,.94); }
  .saeule__wert { position: absolute; left: 50%; transform: translateX(-50%); font: 700 14px var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap; transition: bottom .7s cubic-bezier(.25,.46,.45,.94); } .saeule__label { font: 600 10.5px/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; padding-bottom: 8px; min-height: 34px; hyphens: manual; }
  .saeule--null .saeule__wert { color: var(--muted); }
  .bu { display: grid; gap: 16px; } .bu__felder { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 26px; }
  .bu__felder label { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; font: 600 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); } .bu__felder input { grid-column: 1 / -1; width: 100%; accent-color: var(--green); } .bu__felder b { font: 700 16px var(--sans); color: var(--ink); text-transform: none; letter-spacing: 0; }
  .bu__fazit { font-family: var(--serif); font-size: 16px; line-height: 1.5; border-left: 3px solid var(--pink); padding: 6px 14px; } .bu__fazit b { color: var(--pink); }
  /* ---------- Vergleichstabelle ---------- */
  .vtab { display: grid; gap: 12px; }
  .vtab__filter { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; }

  /* ---------- Zeitungskopf: transparent über dem progressiven Blur (Stapel wie ProgressiveBlur.tsx) ---------- */
  .blur { position: fixed; left: 0; right: 0; top: 0; height: 120px; z-index: 29; pointer-events: none; }
  .blur i { position: absolute; left: 0; right: 0; top: 0; display: block; -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent 100%); mask-image: linear-gradient(to bottom, #000 40%, transparent 100%); }
  .blur i:nth-child(1) { height: 100%; backdrop-filter: blur(.5px); } .blur i:nth-child(2) { height: 85%; backdrop-filter: blur(1px); } .blur i:nth-child(3) { height: 70%; backdrop-filter: blur(2px); } .blur i:nth-child(4) { height: 55%; backdrop-filter: blur(4px); } .blur i:nth-child(5) { height: 40%; backdrop-filter: blur(6px); } .blur i:nth-child(6) { height: 28%; backdrop-filter: blur(10px); } .blur i:nth-child(7) { height: 16%; backdrop-filter: blur(16px); } .blur i:nth-child(8) { height: 8%; backdrop-filter: blur(24px); }
  .blur b { position: absolute; inset: 0; background: linear-gradient(to bottom, var(--paper) 0%, transparent 100%); }
  .kopf { position: sticky; top: 0; z-index: 30; background: transparent; }

  /* Register wie auf der Originalseite (useNavPill): Reihe mit Sparks, max. 650 px, zentriert. Die Pille ist ein dunkles
     Rechteck (32 px) mit „Lupe“: eine weiße Kopie der Reihe, 1,1-fach vergrößert, die gegenläufig mitfährt, sodass die Pille
     wie ein Vergrößerungsglas über der Reihe liegt. Darüber zwei Linien (2 px und 4 px), die der Pille leicht verzögert folgen.
     Erscheint als Punkt aus der Mitte des Eintrags, gleitet mit Überschwingen, zieht sich beim Verlassen zum Punkt zurück. */
  .register { position: relative; display: flex; align-items: center; justify-content: center; flex: 1; min-width: 0; height: 50px; }
  .register__reihe { position: relative; display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 650px; height: 50px; }
  .register button { position: relative; z-index: 3; border: 0; background: none; padding: 12px 20px; margin: 0 -20px; font: 600 16px/1 var(--serif); color: var(--ink); white-space: nowrap; cursor: pointer; transition: color .2s; border-radius: 0; }
  .register button[data-key="plus"] { color: var(--green); }
  .register button.offen { color: var(--pink); }
  .register .punkte-zahl { font: 600 12px/1 var(--sans); color: var(--muted); margin-left: 2px; }
  .nav-lupe__reihe .punkte-zahl { color: rgba(255,255,255,.82); }
  .register__reihe > .spark { margin: 0; opacity: 1; color: var(--ink); }
  .nav-linie { position: absolute; left: 0; width: 1px; opacity: 0; background: var(--ink); pointer-events: none; z-index: 4; }
  .nav-linie--1 { top: calc(50% - 26px); height: 2px; }
  .nav-linie--3 { top: calc(50% - 22px); height: 4px; }
  .nav-pille { position: absolute; top: 50%; left: 0; height: 32px; width: 1px; opacity: 0; pointer-events: none; z-index: 4; transform: translate(0, -50%); }
  .nav-pille__koerper { position: absolute; inset: 0; overflow: hidden; background: var(--ink); }
  .nav-lupe { position: absolute; inset: 0; transform: scale(1.1); transform-origin: center; }
  .nav-lupe__reihe { position: absolute; top: 50%; left: 0; display: flex; align-items: center; justify-content: space-between; color: #fff; pointer-events: none; transform: translate(0, -50%); }
  .nav-lupe__reihe span { font: 600 16px/1 var(--serif); white-space: nowrap; }
  .nav-lupe__reihe .spark { margin: 0; }
  .register .pfad { position: absolute; right: 0; top: 50%; transform: translateY(-50%); max-width: 200px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; }
  .register .pfad b { color: var(--ink); font-weight: 600; }
  @media (min-width: 1700px) { .register .pfad { display: block; } }

  .lu-text { position: absolute; left: 50%; top: 10%; width: min(880px, 92%); margin-left: min(-440px, -46%); font-size: 8.5px; line-height: 1.6; color: var(--muted); opacity: .75; letter-spacing: .01em; text-align: justify; }
  .lu-text .kw { font-weight: 700; color: inherit; transition: color .3s; } .lu-text .kw.an { color: var(--green-ink); }
  .lu-linse { position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 3px solid var(--rule-strong); background: var(--white); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
  .lu-gross { position: absolute; left: 0; top: 0; width: 880px; font-size: 8.5px; line-height: 1.6; color: var(--ink); transform-origin: 0 0; text-align: justify; }
  .lu-gross .kw { font-weight: 700; color: var(--green-ink); }
  .lu-box { position: absolute; border: 1px solid var(--rule); border-top: 3px solid var(--green); background: var(--white); padding: 6px 10px; font-family: var(--serif); font-weight: 700; font-size: 16px; opacity: 0; }
  .lu-leo { position: absolute; width: 90px; opacity: 0; }
  .lu-platzhalter { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 14px; color: var(--muted); font-size: 15px; opacity: 0; }

  /* ---------- Hero (Eingabe sofort) ---------- */
  .hero { position: absolute; inset: 0; overflow: hidden; perspective: 1100px; perspective-origin: 50% 40%; }
  .hero-buehne { position: absolute; inset: 0; transform-style: preserve-3d; }
  .hero-mitte { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(820px, 94%); display: grid; gap: 14px; justify-items: center; text-align: center; z-index: 3; }
  .hero-mitte h1 { font-size: clamp(26px, 3.6vw, 42px); font-weight: 900; }
  .hero-mitte p { margin: 0; font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 15.5px; max-width: 52ch; }
  .hero-mitte--zeitung { top: 47%; }
  .hero-mitte--zeitung::before { content: ""; position: absolute; inset: -60px -80px; background: radial-gradient(ellipse at center, var(--paper) 34%, rgba(250,249,246,.82) 56%, rgba(250,249,246,0) 78%); z-index: -1; pointer-events: none; }
  .hero-mitte .suchpille-wrap { width: min(720px, 100%); margin-top: 6px; }
  /* Landing: Zierlinie, Kicker, Titel, Suchfeld, ein Satz. Ruhig, viel Papier. */
  .szene--landing .buehne { height: calc(100dvh - var(--kopf-h, 64px)); min-height: 520px; }
  /* Landing: Raster mit drei Zeilen (1fr · Eingabe · 1fr). Die Bühne beginnt unter dem 64 px hohen Kopf und reicht bis zum unteren Bildschirmrand;
     damit die Eingabe trotzdem exakt auf der Bildschirmmitte (50 vh) liegt, bekommt das Raster unten die Kopfhöhe als Polster. Titel darüber
     hängt am Ende der ersten Zeile, der Satz darunter am Anfang der dritten, jeweils 30 px Abstand. */
  .hero-mitte--landing { position: absolute; inset: 0; transform: none; width: auto; box-sizing: border-box; padding-bottom: var(--kopf-h, 64px); display: grid; grid-template-rows: 1fr auto 1fr; align-items: center; justify-items: center; gap: 0; }
  .landing-oben { align-self: end; margin-bottom: 30px; display: grid; justify-items: center; }
  .hero-mitte--landing p.landing-sub { align-self: start; margin: 30px auto 0; }
  .landing-zier { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; color: var(--muted); } .landing-zier i { width: 48px; height: 1px; background: var(--muted); opacity: .55; }
  .landing-kicker { font: 400 15px/1 var(--serif); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
  .hero-mitte--landing h1 { font-size: clamp(26px, 3vw, 32px); line-height: 1.22; font-weight: 700; max-width: 30ch; margin: 0; }
  .hero-mitte--landing .suchpille-wrap { width: min(750px, 92%); margin: 0; }
  .hero-mitte p.landing-sub { font: 400 15.5px/1.5 var(--serif); font-style: normal; color: var(--ink); max-width: 44ch; }
  /* Suchfeld wie die Suchleiste der Startseite: Glas-Pille, Outline zeichnet sich bei Hover im Uhrzeigersinn ein (FieldOutline),
     bei Fokus dunkler 2-px-Ring am Feld. Der grüne Knopf erscheint erst bei Fokus oder Text. */
  .suchpille-wrap { position: relative; width: 100%; z-index: 6; }
  .suchpille { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.55); backdrop-filter: blur(16px) brightness(1.15); border-radius: 26px; box-shadow: 0 3px 23px rgba(0,0,0,.02); padding: 6px 6px 6px 22px; min-height: 52px; transition: box-shadow .2s ease; }
  .suchpille-wrap:focus-within > .suchpille { box-shadow: 0 0 0 2px var(--ink); }
  .suchpille input { flex: 1; border: 0; background: none; font: 400 17px/40px var(--sans); color: var(--ink); min-width: 0; outline: none; padding: 0; }
  .suchpille input::placeholder { color: var(--muted); opacity: 1; }
  .suchpille .senden { border: 0; border-radius: 20px; padding: 0 18px; background: var(--green); color: #fff; font: 600 15px/40px var(--sans); white-space: nowrap; flex: none; opacity: 0; transform: translateX(10px) scale(.92); pointer-events: none; transition: opacity .2s ease, transform .3s cubic-bezier(.34,1.56,.64,1), filter .15s; }
  .suchpille .senden:hover { filter: brightness(.95); }
  .suchpille-wrap:focus-within .senden, .suchpille.hat-text .senden { opacity: 1; transform: none; pointer-events: auto; }
  .suchpille-wrap.fliegt { position: fixed; z-index: 28; will-change: left, top, width; }
  .feld-umriss { position: absolute; overflow: visible; pointer-events: none; z-index: 0; }
  .feld-umriss path { fill: none; stroke: var(--ink); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; opacity: .9; stroke-dasharray: 0 100; }
  .hero-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .hero-cta { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 3; border: 0; background: none; color: var(--ink); font-weight: 600; font-size: 13.5px; display: grid; justify-items: center; gap: 5px; letter-spacing: .02em; opacity: 0; }
  .hero-cta.da { opacity: 1; }
  .hero-cta i { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--green); color: var(--green); display: grid; place-items: center; font-style: normal; font-size: 13px; animation: wippen 2.2s ease-in-out infinite; }
  @keyframes wippen { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
  .hero-zaehler { position: absolute; right: 28px; bottom: 26px; text-align: right; font: 700 11px/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; z-index: 3; }
  /* Werkzeugreihe: drei Tools, Trennlinien mit Spark, Hover-Box (dezent, ohne farbige Kanten) */
  .werkzeugreihe { position: relative; display: flex; align-items: stretch; justify-content: center; width: 100%; margin-top: 8px; }
  .trenner { --linie: 70px; flex: none; width: 9px; position: relative; }
  .trenner .spark { position: absolute; left: 50%; top: 50%; margin: -6px 0 0 -6px; }
  .trenner::before, .trenner::after { content: ""; position: absolute; left: 4px; width: 1px; height: var(--linie); background: var(--rule-strong); }
  .werkzeugreihe .trenner { --linie: 28px; }
  .trenner::before { bottom: calc(50% + 11px); } .trenner::after { top: calc(50% + 11px); }
  .werkzeug-k { flex: 1 1 0; max-width: 236px; text-align: left; border: 0; background: none; padding: 12px 22px; display: grid; gap: 3px; align-content: center; cursor: pointer; opacity: 0; transition: opacity .6s ease, transform .9s cubic-bezier(.2,.8,.2,1); position: relative; z-index: 1; }
  .werkzeug-k.da { opacity: 1; transform: none !important; }
  .werkzeug-k b { font-family: var(--serif); font-size: 26px; font-weight: 900; line-height: 1.1; }
  .werkzeug-k b small { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 6px; font-family: var(--sans); }
  .werkzeug-k span { font-size: 12.5px; color: var(--muted); }
  .werkzeug-k .pfeil-link { margin-top: 4px; font-size: 13px; }
  /* Hover-Box (abgerundet), gezeichnet als SVG */
  .hbox { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }
  .hbox path.seg { fill: none; stroke: var(--rule-strong); stroke-width: 1; }
  .hbox .hspark { fill: var(--rule-strong); opacity: 0; transform-box: fill-box; transform-origin: center; }
  .hbox .hspark.dreht { animation: spark-spin 4s linear infinite; }
  /* Lichtfäden / Anflug / Zoom (Runde 5) */
  .lf-raum { position: absolute; inset: 0; transform-style: preserve-3d; }
  .lf-zeichen { position: absolute; left: 50%; top: 50%; width: 220px; height: auto; transform: translate(-50%, -50%); filter: drop-shadow(0 12px 30px rgba(69,161,23,.25)); }
  .lf-faden { position: absolute; width: 3px; border-radius: 2px; background: linear-gradient(180deg, transparent, var(--green) 20%, #9be36e 50%, var(--green) 80%, transparent); box-shadow: 0 0 14px rgba(69,161,23,.55); opacity: 0; will-change: transform, opacity; }
  .af-himmel { position: absolute; inset: 0; perspective: 900px; perspective-origin: 50% 45%; transform-style: preserve-3d; }
  .af-wolke { position: absolute; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,255,255,.98) 0%, rgba(255,255,255,.7) 42%, rgba(255,255,255,0) 72%); filter: blur(1px); will-change: transform; }
  .af-flieger { position: absolute; left: 50%; top: 50%; width: 120px; height: 80px; margin: -40px 0 0 -60px; will-change: transform; }
  .af-horizont { position: absolute; left: 0; right: 0; top: 46%; height: 1px; background: linear-gradient(90deg, transparent, var(--rule) 30%, var(--rule) 70%, transparent); }
  .zo-feld { position: absolute; left: 50%; top: 50%; width: 1100px; margin: -260px 0 0 -550px; font-size: 10px; line-height: 1.7; color: var(--muted); text-align: justify; transform-origin: 50% 40%; will-change: transform; }
  .zo-feld b { color: inherit; font-weight: 700; transition: color .35s; } .zo-feld b.an { color: var(--green-ink); }
  .st-stapel { position: absolute; left: 50%; top: 50%; width: 220px; height: 290px; margin: -100px 0 0 -110px; z-index: 1; }
  .st-blatt { position: absolute; inset: 0; background: var(--white); border: 1px solid var(--rule-strong); }
  .st-blatt b { display: block; padding: 10px 12px 0; font-family: var(--serif); font-size: 12px; }
  .au-kamera { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 30%; overflow: hidden; }
  .au-seite { position: absolute; left: 50%; top: 50%; width: 1500px; margin-left: -750px; background: var(--white); border: 1px solid var(--rule); padding: 30px 40px; transform-origin: 50% 0; will-change: transform; display: grid; gap: 14px; }
  .au-seite .m { font-family: var(--serif); font-weight: 900; font-size: 34px; border-bottom: 2px solid var(--rule-strong); padding-bottom: 8px; }
  .au-spalten { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
  .au-spalten div { display: grid; gap: 6px; } .au-spalten i { display: block; height: 5px; background: var(--rule); } .au-spalten i:nth-child(5n) { width: 60%; }
  .au-spalten s { text-decoration: none; font-family: var(--serif); font-size: 15px; color: var(--muted); transition: color .3s; } .au-spalten s.an { color: var(--green-ink); font-weight: 700; }
  .au-band { position: absolute; left: 0; right: 0; top: 50%; height: 64px; margin-top: -32px; background: linear-gradient(90deg, transparent, rgba(69,161,23,.08) 30%, rgba(69,161,23,.08) 70%, transparent); pointer-events: none; }
  .ko-ring { position: absolute; left: 50%; top: 50%; width: 640px; height: 640px; margin: -320px 0 0 -320px; will-change: transform; }
  .ko-ring svg { width: 100%; height: 100%; overflow: visible; }
  .ko-label { position: absolute; transform: translate(-50%, -50%); font-size: 12.5px; font-weight: 700; white-space: nowrap; background: var(--paper); padding: 2px 8px; }
  .ko-label.tool { color: var(--green-ink); }
  .ko-wert { position: absolute; transform: translate(-50%, -50%); font-family: var(--serif); font-weight: 900; font-size: 18px; color: var(--pink); opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .sr-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- Die Zeitung (Runde 6): öffnet sich beim Laden, wird beim Scrollen zum Papierflieger ---------- */
  .zt-raum { position: absolute; inset: 0; transform-style: preserve-3d; }
  .zt-kamera { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }
  .zt-zeitung { position: absolute; left: 0; top: 0; width: var(--zt-w, 720px); height: var(--zt-h, 480px); margin: calc(var(--zt-h, 480px) / -2) 0 0 calc(var(--zt-w, 720px) / -2); transform-style: preserve-3d; }
  .zt-seite { position: absolute; top: 0; width: 50%; height: 100%; background: var(--white); border: 1px solid var(--rule-strong); transform-style: preserve-3d; backface-visibility: hidden; padding: 4% 4.4%; display: grid; gap: 10px; align-content: start; overflow: hidden; }
  .zt-seite--l { left: 0; transform-origin: 100% 50%; border-right: 0; border-radius: 3px 0 0 3px; }
  .zt-seite--r { right: 0; transform-origin: 0 50%; border-left: 0; border-radius: 0 3px 3px 0; }
  .zt-seite--r::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--rule); }
  .zt-rueck { position: absolute; left: 0; top: 0; width: 50%; height: 100%; background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 3px 0 0 3px; transform-origin: 100% 50%; backface-visibility: hidden; display: grid; place-items: center; padding: 8%; }
  .zt-rueck img { width: 70%; height: auto; opacity: .9; }
  .zt-masthead { display: grid; gap: 6px; border-bottom: 2px solid var(--rule-strong); padding-bottom: 8px; }
  .zt-masthead img { height: 24px; width: auto; justify-self: start; }
  .zt-masthead .r { display: flex; gap: 12px; font: 700 8.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .zt-titel { font-family: var(--serif); font-weight: 900; font-size: 18px; line-height: 1.2; }
  .zt-kolumnen { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .zt-kolumnen div { display: grid; gap: 5px; align-content: start; }
  .zt-kolumnen i { display: block; height: 3px; background: var(--rule); border-radius: 2px; }
  .zt-kolumnen i:nth-child(4n) { width: 62%; } .zt-kolumnen i:nth-child(7n) { width: 80%; }
  .zt-bild { height: 74px; background: var(--fill-1); border-radius: 4px; display: grid; place-items: center; }
  .zt-bild img { width: 34px; height: 34px; opacity: .55; }
  .zt-kasten { border: 1px solid var(--rule-strong); border-radius: 6px; padding: 8px 10px; font-family: var(--serif); font-size: 11px; font-weight: 700; display: grid; gap: 4px; }
  .zt-kasten span { font: 700 8.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--pink); }
  .zt-zahl { font-family: var(--serif); font-weight: 900; font-size: 22px; color: var(--green-ink); }
  .zt-schatten { position: absolute; left: 50%; top: 50%; width: var(--zt-w, 720px); height: var(--zt-h, 480px); margin: calc(var(--zt-h, 480px) / -2) 0 0 calc(var(--zt-w, 720px) / -2); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(51,74,39,.18), rgba(51,74,39,0) 66%); transform: translateZ(-30px) scale(1.12, .9); pointer-events: none; }
  .zt-flieger { position: absolute; left: 50%; top: 50%; width: var(--fl-w, 420px); height: calc(var(--fl-w, 420px) * 0.66); margin: calc(var(--fl-w, 420px) * -0.33) 0 0 calc(var(--fl-w, 420px) / -2); opacity: 0; will-change: transform; transform-style: preserve-3d; filter: drop-shadow(0 18px 24px rgba(51,74,39,.18)); }
  .zt-flieger svg { width: 100%; height: 100%; overflow: visible; }
  .zt-hinweis { position: absolute; left: 50%; bottom: 2%; transform: translateX(-50%); color: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: 0; }

  /* ---------- Faden: Mitte in Lesebreite, Randspalten am Bildschirmrand ---------- */
  /* Faden: 750er-Spalte fest in der Mitte, Randspalten teilen sich den Rest. Text bleibt 728 breit (#mitte polstert 11 px), die Eingabe füllt die vollen 750. */
  .faden { margin: 0; padding: 22px 0 160px; display: grid; grid-template-columns: minmax(0, 1fr) var(--spalte) minmax(0, 1fr); gap: 0; align-items: stretch; position: relative; }
  #mitte { padding: 0 11px; }
  .faden > * { min-width: 0; }
  .rand { align-self: stretch; font-size: 13.5px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  /* Randspalten: mittig im freien Raum neben der Spalte, aber nie näher als 23 px an den Bildschirmrand */
  .rand--links { justify-self: center; width: min(var(--rand-l), calc(100% - 46px)); }
  .rand--rechts { justify-self: center; width: min(var(--rand-r), calc(100% - 46px)); }
  .rand--links .einschub[data-format="skyscraper"] .einschub__flaeche { max-width: 160px; }
  .einschub[data-format="square"] .einschub__flaeche { max-width: 200px; }
  .rand--links .einschub { justify-items: start; }
  .rand--links .einschub .einschub__flaeche { margin: 0; }
  /* Leo fragt (rechte Leiste): Antwort erscheint im Faden */
  .leo-frage { position: relative; border: 1px solid var(--rule-strong); border-radius: 12px; background: var(--white); padding: 10px 14px 10px; display: grid; gap: 7px; font-family: var(--serif); animation: leo-rein .55s cubic-bezier(.34,1.56,.64,1) both; box-shadow: 0 10px 26px rgba(51,74,39,.12); }
  @keyframes leo-rein { from { opacity: 0; transform: translateY(22px) scale(.96); } to { opacity: 1; transform: none; } }
  .leo-frage .spaeter { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: var(--muted); font: 600 11px/1 var(--sans); cursor: pointer; }
  .leo-frage .spaeter:hover { color: var(--ink); }
  .leo-frage .kopf-f { display: flex; align-items: center; gap: 8px; } .leo-frage .kopf-f img { width: 26px; height: 26px; }
  .leo-frage p { margin: 0; font-size: 14.5px; line-height: 1.35; }
  .leo-frage .regler { display: flex; align-items: center; gap: 10px; } .leo-frage input[type=range] { flex: 1; min-width: 0; accent-color: var(--green); }
  .leo-frage .wert { font-size: 18px; font-weight: 700; color: var(--green-ink); font-family: var(--sans); min-width: 44px; text-align: right; }
  .leo-frage .werte { display: flex; justify-content: space-between; font-family: var(--sans); font-size: 11px; color: var(--muted); margin-top: -4px; }
  .leo-frage .aktion { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .leo-frage .btn { font-family: var(--sans); }
  .leo-frage .hinweis-f { font: 600 11px/1.35 var(--sans); color: var(--muted); display: flex; gap: 5px; align-items: center; }
  .leo-frage .hinweis-f i { font-style: normal; color: var(--green); }
  .leo-frage .chips { gap: 6px; } .leo-frage .chips .chip { font-family: var(--sans); font-size: 12.5px; padding: 5px 10px; }
  .leo-frage--danke { border-color: var(--rule); background: var(--paper); }
  /* Randspalte: klebt unter dem Kopf. Oben Verlauf bzw. Glossar (scrollen in sich, wenn sie lang werden), unten die Anzeige.
     Ist der Block höher als der Bildschirm, bleibt die Anzeige unten angeschnitten, bis das Ende des Fadens den Block hochschiebt.
     So sind Verlauf und Glossar immer erreichbar, und die Werbung wandert erst mit dem Ende des Fadens. */
  .rand__lauf { flex: 1; position: relative; }
  .rand__innen { position: sticky; top: calc(var(--kopf-h, 64px) + 16px); min-height: calc(100vh - var(--kopf-h, 64px) - 32px); display: flex; flex-direction: column; gap: 22px; }
  .rand__oben { display: grid; gap: 22px; align-content: start; }
  .verlauf { max-height: 38vh; overflow: auto; scrollbar-width: thin; padding-right: 2px; }
  .rand__fuss { margin-top: auto; flex: none; display: grid; gap: 18px; }
  .nur-breit { display: none; }
  @media (min-width: 1500px) { .nur-breit { display: grid; } }
  .rand h2 { font: 700 10.5px/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .rand ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .rand li button { width: 100%; text-align: left; border: 0; background: none; padding: 4px 0; color: var(--muted); font-size: 13.5px; display: flex; gap: 8px; line-height: 1.35; }
  .rand li button.aktiv { color: var(--ink); font-weight: 700; }
  .rand li button::before { content: "○"; flex: none; } .rand li button.aktiv::before { content: "●"; }
  .rand__leer { color: var(--muted); font-style: italic; }
  .rand .block { border-top: 1px solid var(--rule); padding-top: 10px; display: grid; gap: 4px; }
  .rand form { display: flex; gap: 4px; margin-top: 4px; }
  .rand input { flex: 1; width: 0; min-width: 0; font: inherit; font-size: 12.5px; padding: 5px 10px; border: 1px solid var(--rule); border-radius: 999px; background: var(--white); color: var(--ink); }
  /* Verlauf mit verschachteltem Inhaltsverzeichnis */
  .verlauf ol { list-style: none; margin: 4px 0 6px 6px; padding: 0 0 0 12px; border-left: 1px solid var(--rule); display: grid; gap: 6px; }
  .verlauf ol li button { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 0; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
  .verlauf ol li button::before { content: none; }
  .verlauf ol li button i { flex: none; font: 600 11px/1 var(--serif); font-style: italic; color: var(--muted); min-width: 12px; }
  .verlauf ol li button.aktiv { color: var(--ink); font-weight: 700; } .verlauf ol li button.aktiv i { color: var(--green-ink); }
  /* Glossar-Rail */

  .quelle { font-size: 12px; color: var(--muted); margin: 0; }

  .donut { display: grid; grid-template-columns: 130px 1fr; gap: 16px; align-items: center; }

  .punkt { width: 10px; height: 10px; flex: none; border-radius: 50%; }

  .spiel { display: grid; gap: 10px; }

  .spiel.fertig .aufloesung { display: block; } .spiel.fertig .antworten button { pointer-events: none; opacity: .5; } .spiel.fertig .antworten button.gewaehlt { opacity: 1; }
  .spiel input[type=range] { width: 100%; accent-color: var(--pink); }

  /* Belohnung */
  .belohnung { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.4); z-index: 6; background: var(--pink); color: #fff; font-family: var(--serif); font-weight: 900; font-size: 30px; padding: 10px 26px; border-radius: 999px; box-shadow: 0 14px 34px rgba(211,0,94,.35); opacity: 0; pointer-events: none; white-space: nowrap; }
  .belohnung.an { animation: belohnung 2.2s cubic-bezier(.2,.9,.3,1) forwards; }
  @keyframes belohnung { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 30% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; transform: translate(-50%, -80%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -110%) scale(.9); } }

  /* Eingabe + Sprungleiste */
